<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <style>
      body {
        padding: 10px;
      }
      .composer {
        padding: 8px;
        transition:
          border-color var(--dur-1) var(--ease-out),
          box-shadow var(--dur-1) var(--ease-out);
      }
      .composer:focus-within {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
      }
      .composer textarea {
        min-height: 56px;
        padding: 0;
        border: 0;
        box-shadow: none;
        resize: vertical;
      }
      .composer textarea:focus {
        box-shadow: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .hint {
        flex: 1;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 12px 0 0;
        padding: 0;
      }
      li.note {
        padding: 8px 10px;
        transition: border-color var(--dur-1) var(--ease-out);
      }
      li.note:hover {
        border-color: color-mix(in oklch, var(--foreground) 18%, transparent);
      }
      .text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .meta span {
        flex: 1;
      }
      /* 操作按钮平时淡出，悬停卡片时出现 */
      .meta .ui-btn {
        opacity: 0;
      }
      li.note:hover .meta .ui-btn,
      .meta .ui-btn:focus-visible {
        opacity: 1;
      }
      .error {
        margin-top: 6px;
        font-size: 12px;
        color: var(--destructive);
      }
      .error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="ui-card composer">
      <textarea id="input" class="ui-input" placeholder="写点什么…"></textarea>
      <div class="row">
        <span class="hint">⌘/Ctrl + Enter 保存</span>
        <button id="add" type="button" class="ui-btn ui-btn--primary ui-btn--sm">保存</button>
      </div>
    </div>
    <div id="error" class="error"></div>
    <ul id="list"></ul>
    <script src="enso-ui.js"></script>
    <script>
      const input = document.getElementById('input');
      const list = document.getElementById('list');
      const errorBox = document.getElementById('error');
      const ICON_INSERT =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>';
      const ICON_DELETE =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      ensoUI.tooltip();

      const run = async (method, args) => {
        errorBox.textContent = '';
        try {
          return await window.enso.call(method, args);
        } catch (error) {
          errorBox.textContent = error.message;
          return null;
        }
      };

      // 首次渲染错落入场；之后只有新出现的便签做添加动画
      let known = null;

      function iconButton(svg, tip, extra) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ui-btn ui-btn--icon ui-btn--sm' + (extra ? ' ' + extra : '');
        button.dataset.tip = tip;
        button.setAttribute('aria-label', tip);
        button.innerHTML = svg;
        return button;
      }

      function render(notes) {
        list.replaceChildren();
        list.classList.toggle('ui-stagger', known === null);
        if (!notes || notes.length === 0) {
          known = new Set();
          const empty = document.createElement('li');
          empty.className = 'ui-empty';
          empty.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v5a1 1 0 0 0 1 1h5"/></svg><span>还没有便签</span>';
          list.append(empty);
          return;
        }
        for (const note of notes) {
          const item = document.createElement('li');
          item.className = 'ui-card note';
          if (known && !known.has(note.id)) item.classList.add('ui-enter');
          const text = document.createElement('div');
          text.className = 'text';
          text.textContent = note.text;
          const meta = document.createElement('div');
          meta.className = 'meta';
          const time = document.createElement('span');
          time.textContent = new Date(note.at).toLocaleString();
          const insert = iconButton(ICON_INSERT, '插入输入框');
          insert.onclick = () => run('insert', { id: note.id });
          const remove = iconButton(ICON_DELETE, '删除', 'ui-btn--destructive');
          remove.onclick = async () => {
            const [next] = await Promise.all([run('remove', { id: note.id }), ensoUI.leave(item)]);
            render(next);
          };
          meta.append(time, insert, remove);
          item.append(text, meta);
          list.append(item);
        }
        ensoUI.stagger(list);
        known = new Set(notes.map((note) => note.id));
      }

      async function add() {
        const text = input.value.trim();
        if (!text) return;
        const notes = await run('add', { text });
        if (notes) {
          input.value = '';
          render(notes);
        }
      }

      document.getElementById('add').onclick = add;
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          add();
        }
      });
      run('list').then(render);
    </script>
  </body>
</html>
