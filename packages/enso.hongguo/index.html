<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <link rel="stylesheet" href="player.css" />
    <style>
      :root {
        --hg: oklch(0.637 0.237 25.331);
      }
      :root[data-theme='dark'] {
        --hg: oklch(0.704 0.191 22.216);
      }
      body { padding: 12px; }
      section:not([hidden]) {
        animation: ui-rise var(--dur-3) var(--ease-out) both, ui-fade-in var(--dur-2) var(--ease-out) both;
      }
      svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .nav .ui-seg { flex: none; }
      .bar { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
      .search { position: relative; flex: 1; min-width: 0; }
      .search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; color: var(--muted-foreground); pointer-events: none; }
      .search .ui-input { padding-left: 28px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 10px; }
      .card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .card .img {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: var(--radius-md);
        background: var(--muted) center / cover no-repeat;
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 6%, transparent);
        transition: transform var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
      }
      .grid .card:hover .img { transform: scale(1.03); box-shadow: var(--shadow-lg); }
      .grid .card:hover:active .img { transform: scale(0.99); transition-duration: var(--dur-1); }
      .card .badge {
        position: absolute; right: 4px; bottom: 4px; padding: 1px 6px; border-radius: 999px;
        font-size: 10.5px; font-weight: 500; color: #fff;
        background: rgb(0 0 0 / 0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      .card .t {
        margin-top: 6px; font-size: 12px; font-weight: 500; line-height: 1.4; overflow: hidden;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        transition: color var(--dur-1) var(--ease-out);
      }
      .grid .card:hover .t { color: var(--hg); }
      .skel .img { aspect-ratio: 3 / 4; }
      .skel .line { height: 10px; margin-top: 8px; width: 80%; }

      h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted-foreground); font-weight: 500; }
      .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
      .head h3 { margin: 0; }
      .muted { color: var(--muted-foreground); font-size: 12px; }
      .error {
        margin: 8px 0; padding: 8px 10px; border-radius: var(--radius-md); font-size: 12px; white-space: pre-wrap;
        color: var(--destructive); background: color-mix(in oklch, var(--destructive) 8%, transparent);
        border: 1px solid color-mix(in oklch, var(--destructive) 20%, transparent);
        animation: ui-fade-in var(--dur-2) var(--ease-out);
      }
      .error:empty, .ui-empty:empty { display: none; }
      #homeError { white-space: pre-wrap; }
      .more { display: flex; margin: 16px auto 4px; }
      .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }

      .meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; }
      .meta .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; user-select: none; }
      .desc { margin: 10px 0 4px; font-size: 12px; line-height: 1.6; color: var(--muted-foreground); }
      .desc:empty { display: none; }

      .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; margin-top: 12px; }
      .eps button {
        height: 30px; padding: 0; border: 0; border-radius: var(--radius-md);
        font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums;
        color: var(--foreground); background: transparent; cursor: pointer;
        transition: color var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-spring);
      }
      .eps button:hover:active { transform: scale(var(--press-scale)); }
      .eps button.seen:not(.on) { color: var(--muted-foreground); }
      .eps button.on { color: var(--hg); font-weight: 600; background: color-mix(in oklch, var(--hg) 12%, transparent); }
      .eps button:disabled { opacity: 0.3; cursor: default; }

      #historyList { display: flex; flex-direction: column; gap: 2px; }
      .row { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: var(--radius-lg); cursor: pointer; }
      .row .img { width: 44px; flex: none; }
      .row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .row .info .t { margin: 0; -webkit-line-clamp: 1; }
      .row .x { opacity: 0; transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out), transform var(--dur-2) var(--ease-spring); }
      .row:hover .x, .row .x:focus-visible { opacity: 1; }
      .prog { height: 3px; margin-top: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; }
      .prog i { display: block; height: 100%; border-radius: inherit; background: var(--hg); }
      .cache { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px; }
      .cache .muted { flex: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <nav class="nav" id="nav">
      <div class="ui-seg" id="tabs" role="tablist">
        <button id="reset" type="button" aria-pressed="true">推荐</button>
        <button id="openHistory" type="button" aria-pressed="false">历史</button>
      </div>
    </nav>

    <section id="home">
      <div class="bar">
        <label class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="q" class="ui-input" type="search" placeholder="搜索短剧，回车" />
        </label>
      </div>
      <div id="recent" hidden>
        <div class="head">
          <h3>继续观看</h3>
          <button class="ui-btn ui-btn--sm" id="allHistory" type="button">全部<svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></button>
        </div>
        <div class="grid ui-stagger" id="recentGrid"></div>
        <h3 style="margin-top: 18px" id="listTitle">推荐</h3>
      </div>
      <div id="homeError" class="ui-empty"></div>
      <div class="grid ui-stagger" id="grid"></div>
      <button id="more" class="more ui-btn ui-btn--outline" type="button" hidden>加载更多</button>
    </section>

    <section id="history" hidden>
      <div class="bar">
        <button id="historyBack" class="ui-btn ui-btn--icon" type="button" data-tip="返回" hidden>
          <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span class="title">观看历史</span>
        <button id="clearHistory" class="ui-btn ui-btn--sm ui-btn--destructive" type="button">清空</button>
      </div>
      <div class="cache">
        <span class="muted" id="cacheInfo">缓存计算中…</span>
        <button id="clearCache" class="ui-btn ui-btn--sm ui-btn--outline" type="button" hidden>清理缓存</button>
      </div>
      <div id="historyList"></div>
    </section>

    <section id="detail" hidden>
      <div class="bar">
        <button id="back" class="ui-btn ui-btn--icon" type="button" data-tip="返回">
          <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span class="title" id="seriesTitle"></span>
      </div>
      <div id="player"><video id="video" playsinline autoplay></video></div>
      <div class="meta">
        <span class="muted ui-mono" id="status"></span>
        <label class="toggle"><input type="checkbox" class="ui-switch" id="auto" checked /> 自动下一集</label>
      </div>
      <div id="playError" class="error"></div>
      <div class="desc" id="desc"></div>
      <div class="eps" id="eps"></div>
    </section>

    <script src="enso-ui.js"></script>
    <script src="player.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const store = {
        get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
      };

      // Host allows 10 UI calls/s per plugin; pace calls and let playback jump the queue.
      const queue = [];
      let pumping = false;
      const call = (method, args, priority = 1) =>
        new Promise((resolve, reject) => {
          queue.push({ method, args, priority, resolve, reject, tries: 0 });
          queue.sort((a, b) => a.priority - b.priority);
          pump();
        });
      async function pump() {
        if (pumping) return;
        pumping = true;
        while (queue.length) {
          const job = queue.shift();
          enso.call(job.method, job.args).then(job.resolve, async (e) => {
            if (/频繁|RATE_LIMITED|连续失败|CIRCUIT/.test(e.message) && job.tries++ < 20) {
              await sleep(/连续失败|CIRCUIT/.test(e.message) ? 3000 : 400);
              queue.unshift(job);
              pump();
            } else job.reject(e);
          });
          await sleep(120);
        }
        pumping = false;
      }

      // ---------- covers ----------
      const covers = new Map();
      const coverQueue = [];
      let coverBusy = 0;
      const observer = new IntersectionObserver((entries) => {
        for (const en of entries) if (en.isIntersecting) { observer.unobserve(en.target); coverQueue.push(en.target); }
        drainCovers();
      }, { rootMargin: '200px' });
      async function drainCovers() {
        while (coverBusy < 2 && coverQueue.length) {
          const el = coverQueue.shift();
          const url = el.dataset.cover;
          coverBusy++;
          (covers.has(url) ? Promise.resolve(covers.get(url)) : call('cover', { url }, 2).catch(() => null))
            .then((data) => {
              if (data) { covers.set(url, data); el.style.backgroundImage = `url("${data}")`; }
            })
            .finally(() => { coverBusy--; drainCovers(); });
        }
      }

      function card(s, badge) {
        const el = document.createElement('div');
        el.className = 'card';
        el.title = s.description || s.title;
        const img = document.createElement('div');
        img.className = 'img';
        if (badge) {
          const b = document.createElement('span');
          b.className = 'badge';
          b.textContent = badge;
          img.append(b);
        }
        if (s.cover) {
          img.dataset.cover = s.cover;
          if (covers.has(s.cover)) img.style.backgroundImage = `url("${covers.get(s.cover)}")`;
          else observer.observe(img);
        }
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = s.title;
        el.append(img, t);
        el.onclick = () => openSeries(s);
        return el;
      }

      // ---------- home ----------
      let feed = { method: 'discover', q: '', cursor: '', seen: new Set(), token: 0 };
      async function loadFeed(reset) {
        if (reset) {
          feed = { method: feed.method, q: feed.q, cursor: '', seen: new Set(), token: feed.token + 1 };
          $('grid').replaceChildren();
        }
        const token = feed.token;
        $('homeError').textContent = '';
        $('homeError').className = 'ui-empty';
        $('more').hidden = true;
        const status = skeleton(reset ? 6 : 3);
        $('grid').after(status);
        const start = $('grid').children.length;
        try {
          const page = await call(feed.method, { q: feed.q, cursor: feed.cursor || undefined });
          if (token !== feed.token) return;
          for (const s of page.items) {
            if (feed.seen.has(s.id)) continue;
            feed.seen.add(s.id);
            $('grid').append(card(s, s.count ? `${s.count}集` : ''));
          }
          [...$('grid').children].slice(start).forEach((el, i) => el.style.setProperty('--i', i));
          feed.cursor = page.cursor;
          $('more').hidden = !page.hasMore;
          if (!$('grid').children.length) $('homeError').textContent = feed.q ? '没有搜到结果' : '没有内容';
        } catch (e) {
          if (token === feed.token) { $('homeError').className = 'error'; $('homeError').textContent = e.message; $('more').hidden = false; }
        } finally {
          status.remove();
        }
      }
      function skeleton(n) {
        const el = document.createElement('div');
        el.className = 'grid skel';
        el.style.marginTop = '12px';
        el.setAttribute('aria-label', '加载中');
        for (let i = 0; i < n; i++) {
          const c = document.createElement('div');
          c.innerHTML = '<div class="img ui-skeleton"></div><div class="line ui-skeleton"></div>';
          el.append(c);
        }
        return el;
      }
      function renderRecent() {
        const recent = loadHistory();
        $('recent').hidden = !recent.length;
        $('recentGrid').replaceChildren(...recent.slice(0, 6).map((r) => card(r, `第${r.number}集`)));
        ensoUI.stagger($('recentGrid'));
        $('listTitle').textContent = feed.q ? `搜索：${feed.q}` : '推荐';
      }

      // ---------- history ----------
      // entry: { id, title, description, cover, count, number, time, duration, at, watched: [numbers] }
      const HISTORY_MAX = 50;
      const loadHistory = () => store.get('recent', []);
      const saveHistory = (list) => store.set('recent', list.slice(0, HISTORY_MAX));
      const clock = (s) => {
        s = Math.max(0, Math.floor(s || 0));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      };
      const ago = (at) => {
        const m = Math.floor((Date.now() - at) / 60000);
        if (m < 1) return '刚刚';
        if (m < 60) return `${m} 分钟前`;
        if (m < 1440) return `${Math.floor(m / 60)} 小时前`;
        return `${Math.floor(m / 1440)} 天前`;
      };
      function renderHistory() {
        const list = loadHistory();
        $('clearHistory').hidden = !list.length;
        if (!list.length) {
          const empty = document.createElement('div');
          empty.className = 'ui-empty';
          empty.innerHTML =
            '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg><span>还没有观看记录</span>';
          $('historyList').replaceChildren(empty);
          return;
        }
        $('historyList').replaceChildren(
          ...list.map((h) => {
            const row = document.createElement('div');
            row.className = 'row card';
            row.dataset.fill = '';
            const img = card(h).querySelector('.img');
            const info = document.createElement('div');
            info.className = 'info';
            const t = document.createElement('div');
            t.className = 't';
            t.textContent = h.title;
            const meta = document.createElement('div');
            meta.className = 'muted';
            const total = h.count ? ` / 共${h.count}集` : '';
            meta.textContent = `看到第${h.number}集 ${clock(h.time)}${total} · ${ago(h.at)}`;
            const prog = document.createElement('div');
            prog.className = 'prog';
            const bar = document.createElement('i');
            bar.style.width = `${h.duration ? Math.min(100, (h.time / h.duration) * 100) : 0}%`;
            prog.append(bar);
            info.append(t, meta, prog);
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'x ui-btn ui-btn--icon ui-btn--sm';
            x.dataset.tip = '删除这条记录';
            x.setAttribute('aria-label', '删除这条记录');
            x.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>';
            x.onclick = (e) => {
              e.stopPropagation();
              saveHistory(loadHistory().filter((r) => r.id !== h.id));
              ensoUI.leave(row).then(() => { if (!loadHistory().length) renderHistory(); });
            };
            row.append(img, info, x);
            row.onclick = () => openSeries(h);
            return row;
          })
        );
      }
      function syncNav() {
        $('nav').hidden = !$('detail').hidden;
        $('reset').setAttribute('aria-pressed', String(!$('home').hidden));
        $('openHistory').setAttribute('aria-pressed', String(!$('history').hidden));
        ensoUI.seg($('tabs'));
      }
      function showHistory() {
        $('home').hidden = true;
        $('history').hidden = false;
        syncNav();
        renderHistory();
        refreshCache();
        window.scrollTo(0, 0);
      }
      $('openHistory').onclick = showHistory;
      $('allHistory').onclick = showHistory;
      $('historyBack').onclick = () => show(false);
      const mb = (n) => (n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(1)} MB`);
      async function refreshCache() {
        const info = await call('cache', {}, 1);
        $('cacheInfo').textContent = info
          ? `缓存 ${mb(info.bytes)} · ${Math.floor(info.videos / 2)} 集视频 · ${info.covers} 张封面`
          : '缓存信息暂时取不到';
        $('clearCache').hidden = !info?.bytes;
      }
      let cacheArmed = 0;
      $('clearCache').onclick = async () => {
        const btn = $('clearCache');
        if (Date.now() - cacheArmed > 3000) {
          cacheArmed = Date.now();
          btn.textContent = '确认清理';
          setTimeout(() => (btn.textContent = '清理缓存'), 3000);
          return;
        }
        cacheArmed = 0;
        btn.textContent = '清理缓存';
        await call('cache', { clear: true }, 2);
        refreshCache();
      };
      // sandbox has no allow-modals, so confirm() is unavailable: click twice instead
      let clearArmed = 0;
      $('clearHistory').onclick = () => {
        const btn = $('clearHistory');
        if (Date.now() - clearArmed > 3000) {
          clearArmed = Date.now();
          btn.textContent = '确认清空';
          setTimeout(() => (btn.textContent = '清空'), 3000);
          return;
        }
        clearArmed = 0;
        btn.textContent = '清空';
        saveHistory([]);
        renderHistory();
      };
      $('q').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.isComposing) return;
        const q = $('q').value.trim();
        feed.method = q ? 'search' : 'discover';
        feed.q = q;
        renderRecent();
        loadFeed(true);
      });
      $('reset').onclick = () => {
        if (!$('history').hidden) return show(false);
        $('q').value = '';
        feed.method = 'discover';
        feed.q = '';
        renderRecent();
        loadFeed(true);
      };
      $('more').onclick = () => loadFeed(false);

      // ---------- detail / player ----------
      const video = $('video');
      let series = null;
      let episodes = [];
      let current = null;
      let playToken = 0;
      const QUALITIES = ['360p', '480p', '540p', '720p', '1080p'];
      let quality = store.get('quality', '720p');
      if (!QUALITIES.includes(quality)) quality = '720p';
      $('auto').checked = store.get('auto', true);
      $('auto').onchange = () => store.set('auto', $('auto').checked);
      const nextOf = (ep) => ep && episodes.find((e) => e.number > ep.number && e.playable);
      const player = createPlayer($('player'), video, {
        qualities: QUALITIES,
        quality: () => quality,
        setQuality: (q) => {
          quality = q;
          store.set('quality', q);
          if (current) play(current, video.currentTime);
        },
        onNext: () => {
          const next = nextOf(current);
          if (next) play(next);
        },
        duration: () => dur,
      });

      function show(detail) {
        $('home').hidden = detail;
        $('history').hidden = true;
        $('detail').hidden = !detail;
        syncNav();
        if (!detail) {
          stop();
          renderRecent();
        }
        window.scrollTo(0, 0);
      }
      $('back').onclick = () => show(false);

      async function openSeries(s) {
        series = s;
        episodes = [];
        current = null;
        $('seriesTitle').textContent = s.title;
        $('desc').textContent = s.description || '';
        $('eps').replaceChildren();
        $('playError').textContent = '';
        $('status').textContent = '加载分集…';
        show(true);
        try {
          const rows = await call('episodes', { seriesId: s.id });
          episodes = rows.map(([id, number, playable, title]) => ({ id, number, playable: Boolean(playable), title }));
        } catch (e) {
          $('playError').textContent = e.message;
          return;
        }
        if (series !== s) return;
        const last = loadHistory().find((r) => r.id === s.id);
        const seen = new Set(last?.watched ?? []);
        $('eps').replaceChildren(
          ...episodes.map((ep) => {
            const b = document.createElement('button');
            b.textContent = ep.number;
            b.type = 'button';
            b.dataset.fill = '';
            b.title = ep.title || `第${ep.number}集`;
            b.disabled = !ep.playable;
            b.dataset.id = ep.id;
            b.classList.toggle('seen', seen.has(ep.number));
            b.onclick = () => play(ep, resumeAt(ep));
            return b;
          })
        );
        let ep = episodes.find((e) => e.number === last?.number && e.playable);
        // last episode was finished: continue from the next one
        if (ep && last.duration && last.time >= last.duration - 3) ep = episodes.find((e) => e.number > ep.number && e.playable) ?? ep;
        ep ??= episodes.find((e) => e.playable);
        if (ep) play(ep, resumeAt(ep));
        else $('status').textContent = '没有可播放的分集';
      }

      function resumeAt(ep) {
        const h = loadHistory().find((r) => r.id === series?.id);
        if (!h || h.number !== ep.number || !h.time) return 0;
        return h.duration && h.time >= h.duration - 3 ? 0 : h.time;
      }

      // pos only tracks real playback of `current`; src swaps reset currentTime and must not overwrite it
      let pos = 0;
      let dur = 0;
      function remember({ finished = false } = {}) {
        if (!series || !current) return;
        const list = loadHistory();
        const prev = list.find((r) => r.id === series.id);
        const watched = new Set(prev?.watched ?? []);
        const duration = Math.floor(dur || 0);
        if (finished || (duration && pos >= duration * 0.9)) watched.add(current.number);
        const entry = {
          id: series.id,
          title: series.title,
          description: series.description?.slice(0, 120),
          cover: series.cover,
          count: episodes.length || series.count || prev?.count,
          number: current.number,
          time: Math.floor(finished ? duration : pos),
          duration,
          at: Date.now(),
          watched: [...watched].sort((a, b) => a - b),
        };
        saveHistory([entry, ...list.filter((r) => r.id !== series.id)]);
        const b = [...$('eps').children].find((x) => x.dataset.id === current.id);
        if (b && watched.has(current.number)) b.classList.add('seen');
      }
      const tracking = () => !video.seeking && video.readyState >= 2 && video.getAttribute('src');
      video.addEventListener('pause', () => {
        if (tracking()) { pos = video.currentTime; remember(); }
      });
      let lastSave = 0;
      video.addEventListener('timeupdate', () => {
        if (!tracking()) return;
        pos = video.currentTime;
        if (Date.now() - lastSave > 5000) { lastSave = Date.now(); remember(); }
      });
      window.addEventListener('pagehide', () => remember());
      video.addEventListener('ended', () => {
        if (!current) return;
        remember({ finished: true });
        if (!$('auto').checked) return;
        const next = nextOf(current);
        if (next) {
          player.flash(`第${next.number}集`);
          play(next);
        }
      });

      function stop() {
        remember();
        current = null;
        playToken++;
        player.exitFull();
        video.pause();
        video.srcObject = null;
        video.removeAttribute('src');
        video.load();
      }

      const mimeOf = (codec) =>
        `video/mp4; codecs="${/^(hvc1|hev1)$/.test(codec) ? `${codec}.1.6.L120.90` : 'avc1.64001f'},mp4a.40.2"`;
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const appended = (sb) => new Promise((r) => (sb.updating ? sb.addEventListener('updateend', r, { once: true }) : r()));
      async function append(sb, bytes, token) {
        for (;;) {
          await appended(sb);
          try { sb.appendBuffer(bytes); return appended(sb); } catch (e) {
            if (e.name !== 'QuotaExceededError' || token !== playToken) throw e;
          }
          const behind = video.currentTime - 10;
          if (sb.buffered.length && behind > sb.buffered.start(0)) { sb.remove(0, behind); await appended(sb); }
          await sleep(1000);
          if (token !== playToken) return;
        }
      }
      const ahead = () => {
        const b = video.buffered;
        return b.length ? b.end(b.length - 1) - video.currentTime : 0;
      };

      async function play(ep, startAt = 0) {
        if (current && current.id !== ep.id) remember();
        const token = ++playToken;
        current = ep;
        pos = startAt;
        player.setTitle(`第${ep.number}集${ep.title ? ` · ${ep.title}` : ''}`, series?.title ?? '');
        player.setHasNext(Boolean(nextOf(ep)));
        player.loading(true);
        const h = loadHistory().find((r) => r.id === series?.id);
        dur = h?.number === ep.number ? h.duration || 0 : 0;
        for (const b of $('eps').children) b.classList.toggle('on', b.dataset.id === ep.id);
        $('playError').textContent = '';
        $('status').textContent = `第${ep.number}集 · 解析中…`;
        remember();
        let info;
        try {
          info = await call('open', { episodeId: ep.id, quality }, 0);
        } catch (e) {
          if (token === playToken) { $('playError').textContent = e.message; $('status').textContent = ''; player.loading(false); }
          return;
        }
        if (token !== playToken) return;
        if (info.duration) dur = info.duration;
        const label = `第${ep.number}集 · ${info.definition}`;
        const mime = mimeOf(info.codec);
        const MS = window.ManagedMediaSource || window.MediaSource;
        const useMse = MS && MS.isTypeSupported(mime);
        let sb = null;
        let ms = null;
        const parts = [];
        if (useMse) {
          ms = new MS();
          if (window.ManagedMediaSource && ms instanceof ManagedMediaSource) video.disableRemotePlayback = true;
          // WebKit rejects MediaSource blob URLs in opaque-origin (sandboxed) frames; Chromium rejects MediaSource as srcObject.
          try { video.srcObject = ms; } catch { video.src = URL.createObjectURL(ms); }
          await new Promise((r) => ms.addEventListener('sourceopen', r, { once: true }));
          if (token !== playToken) return;
          sb = ms.addSourceBuffer(mime);
          if (startAt) video.currentTime = startAt;
        }
        let offset = 0;
        try {
          for (;;) {
            if (token !== playToken) return;
            if (sb && ahead() > 90) { await sleep(1000); continue; }
            const r = await call('chunk', { episodeId: info.episodeId, definition: info.definition, offset }, 0);
            if (token !== playToken) return;
            if (r.data) {
              const bytes = b64(r.data);
              if (sb) await append(sb, bytes, token);
              else parts.push(bytes);
              offset = r.next;
              $('status').textContent = `${label} · 已缓冲 ${(offset / 1048576).toFixed(1)}MB`;
            }
            if (r.done) break;
          }
          if (sb) {
            await appended(sb);
            if (ms.readyState === 'open') ms.endOfStream();
          } else {
            video.srcObject = null;
            video.src = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
            if (startAt) video.currentTime = startAt;
          }
          $('status').textContent = label;
          prefetch(ep);
        } catch (e) {
          if (token === playToken) $('playError').textContent = e.message;
        }
      }

      function prefetch(ep) {
        if (!$('auto').checked) return;
        const next = episodes.find((e) => e.number > ep.number && e.playable);
        if (next) call('open', { episodeId: next.id, quality }, 1).catch(() => {});
      }

      video.addEventListener('error', () => {
        if (video.getAttribute('src') || video.srcObject) $('playError').textContent = `播放失败：${video.error?.message || video.error?.code || ''}`;
      });
      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth) video.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
      });
      video.addEventListener('durationchange', () => {
        if (Number.isFinite(video.duration) && video.duration > 0) dur = video.duration;
      });

      ensoUI.tooltip();
      ensoUI.fill($('eps'));
      ensoUI.fill($('historyList'));
      syncNav();
      renderRecent();
      loadFeed(true);
    </script>
  </body>
</html>
