<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <link rel="stylesheet" href="player.css" />
    <style>
      :root {
        --hg: oklch(0.637 0.237 25.331);
      }
      :root[data-theme='dark'] {
        --hg: oklch(0.704 0.191 22.216);
      }
      /* 自己给底色，不靠宿主透出：浅色白底深字、深色黑底白字都自洽 */
      body { padding: 12px 12px 64px; background: var(--background); }
      section:not([hidden]) {
        animation: ui-rise var(--dur-3) var(--ease-out) both, ui-fade-in var(--dur-2) var(--ease-out) both;
      }
      svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        display: flex; height: 52px; padding-bottom: env(safe-area-inset-bottom, 0);
        background: var(--background); border-top: 1px solid var(--border);
      }
      .tabbar button {
        flex: 1; border: 0; background: none; cursor: pointer;
        color: var(--muted-foreground); font: 500 12px/1 ui-sans-serif, system-ui;
      }
      .tabbar button[aria-pressed='true'] { color: var(--foreground); font-weight: 700; }
      body:has(#reel:not([hidden])) { padding: 0 0 52px; background: #000; }
      body:has(#reel:not([hidden])) .tabbar {
        background: #111; border-top-color: rgb(255 255 255 / 0.08);
      }
      body:has(#reel:not([hidden])) .tabbar button { color: rgb(255 255 255 / 0.42); }
      body:has(#reel:not([hidden])) .tabbar button[aria-pressed='true'] { color: #fff; }
      /* 推荐播放页只看高光，列表那套控件一律不露头 */
      body:has(#reel:not([hidden])) #grid,
      body:has(#reel:not([hidden])) #more,
      body:has(#reel:not([hidden])) #recent,
      body:has(#reel:not([hidden])) #homeError { display: none !important; }
      body:has(#detail:not([hidden])) { padding-bottom: 12px; }
      .bar { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
      .search { position: relative; flex: 1; min-width: 0; }
      .search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; color: var(--muted-foreground); pointer-events: none; }
      .search .ui-input { padding-left: 28px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 10px; }
      .card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .card .img {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: var(--radius-md);
        background: var(--muted) center / cover no-repeat;
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 6%, transparent);
        transition: transform var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
      }
      .grid .card:hover .img { transform: scale(1.03); box-shadow: var(--shadow-lg); }
      .grid .card:hover:active .img { transform: scale(0.99); transition-duration: var(--dur-1); }
      .card .badge {
        position: absolute; right: 4px; bottom: 4px; padding: 1px 6px; border-radius: 999px;
        font-size: 10.5px; font-weight: 500; color: #fff;
        background: rgb(0 0 0 / 0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      .card .t {
        margin-top: 6px; font-size: 12px; font-weight: 500; line-height: 1.4; overflow: hidden;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        transition: color var(--dur-1) var(--ease-out);
      }
      .grid .card:hover .t { color: var(--hg); }
      .skel .img { aspect-ratio: 3 / 4; }
      .skel .line { height: 10px; margin-top: 8px; width: 80%; }

      h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted-foreground); font-weight: 500; }
      .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
      .head h3 { margin: 0; }
      .muted { color: var(--muted-foreground); font-size: 12px; }
      .error {
        margin: 8px 0; padding: 8px 10px; border-radius: var(--radius-md); font-size: 12px; white-space: pre-wrap;
        color: var(--destructive); background: color-mix(in oklch, var(--destructive) 8%, transparent);
        border: 1px solid color-mix(in oklch, var(--destructive) 20%, transparent);
        animation: ui-fade-in var(--dur-2) var(--ease-out);
      }
      .error:empty, .ui-empty:empty { display: none; }
      #homeError { white-space: pre-wrap; }
      .more { display: flex; margin: 16px auto 4px; }
      .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }

      .meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; }
      .meta .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; user-select: none; }
      .desc { margin: 10px 0 4px; font-size: 12px; line-height: 1.6; color: var(--muted-foreground); }
      .desc:empty { display: none; }
      /* 首页瀑布流的卡片多一行剧情摘要 */
      .card .d {
        font-size: 11px; line-height: 1.4; color: var(--muted-foreground); margin-top: 2px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      /* 推荐高光：对齐 App「推荐」全屏播放 */
      #reel {
        position: relative; overflow: hidden; color: #fff;
        margin: 0; background: #000; height: calc(100dvh - 52px); min-height: 360px;
      }
      #reelVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; cursor: pointer; }
      .reel-tabs {
        position: absolute; top: 0; left: 0; right: 0; z-index: 3;
        display: flex; align-items: center; padding: 6px 4px 0;
      }
      .reel-tabs-ch { flex: 1; display: flex; justify-content: center; gap: 22px; }
      .reel-tabs-ch button {
        border: 0; background: none; color: rgb(255 255 255 / 0.5); cursor: pointer;
        font: 600 16px/1.2 ui-sans-serif, system-ui; padding: 10px 2px;
      }
      .reel-tabs-ch button.on { color: #fff; box-shadow: inset 0 -2px 0 #fff; }
      .reel-search {
        flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%;
        background: none; color: #fff; display: grid; place-items: center; cursor: pointer;
      }
      .reel-search .i { width: 20px; height: 20px; }
      .reel-play {
        position: absolute; left: 50%; top: 42%; z-index: 2; width: 64px; height: 64px;
        margin: -32px 0 0 -32px; border: 0; border-radius: 50%; cursor: pointer;
        background: rgb(255 255 255 / 0.92); display: grid; place-items: center;
      }
      .reel-play svg { width: 28px; height: 28px; fill: #111; margin-left: 3px; }
      .reel-meta {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 48px 14px 16px;
        background: linear-gradient(to top, #000 12%, transparent); pointer-events: none;
      }
      .reel-meta > * { pointer-events: auto; }
      .reel-rec { font-size: 12px; color: rgb(255 255 255 / 0.72); }
      .reel-title { font-size: 18px; font-weight: 700; margin-top: 6px; letter-spacing: 0.2px; }
      .reel-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .reel-tags:empty { display: none; }
      .reel-tags span { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgb(255 255 255 / 0.12); }
      .reel-desc {
        margin-top: 8px; font-size: 12px; line-height: 1.5; color: rgb(255 255 255 / 0.7);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer;
      }
      .reel-desc.open { -webkit-line-clamp: 8; }
      .reel-desc:empty { display: none; }
      .reel-row { display: flex; gap: 8px; margin-top: 12px; }
      .reel-watch {
        flex: 1; min-width: 0; margin: 0; border: 0; border-radius: 10px; cursor: pointer;
        padding: 11px 12px; text-align: left; font-size: 13px; font-weight: 600;
        color: #fff; background: rgb(28 28 28 / 0.96);
      }
      .reel-skip {
        flex: none; border: 0; border-radius: 10px; cursor: pointer;
        padding: 11px 16px; font-size: 13px; font-weight: 600;
        color: #fff; background: rgb(255 255 255 / 0.16);
      }
      .reel-side {
        position: absolute; right: 10px; bottom: 178px; z-index: 2;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
      }
      .reel-stat { text-align: center; font-size: 11px; color: #fff; }
      .reel-stat:empty { display: none; }
      .reel-stat svg { width: 26px; height: 26px; stroke: #fff; fill: none; display: block; margin: 0 auto 4px; stroke-width: 1.8; }
      .reel-mute {
        width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer;
        background: rgb(20 20 20 / 0.6); color: #fff; display: grid; place-items: center;
      }
      .reel-mute svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.8; }
      .reel-mute[data-muted='1'] { color: rgb(255 255 255 / 0.55); }
      /* 播放进度：贴着播放器底边，点/拖都能 seek */
      .reel-prog {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; height: 14px;
        display: flex; align-items: flex-end; cursor: pointer; touch-action: none;
      }
      .reel-prog::before {
        content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
        background: rgb(255 255 255 / 0.24);
      }
      .reel-prog .fill {
        position: relative; height: 3px; width: 0; background: var(--hg);
        transition: width 0.12s linear;
      }
      .reel-prog.dragging .fill { transition: none; }
      .reel-prog.big { height: 20px; }
      .reel-prog.big::before, .reel-prog.big .fill { height: 4px; }
      .reel-hint {
        position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 20px; text-align: center;
        color: rgb(255 255 255 / 0.92); font-size: 15px; font-weight: 600; pointer-events: none;
        text-shadow: 0 1px 8px rgb(0 0 0 / 0.6);
      }
      .reel-hint:empty { display: none; }

      /* 详情页占满一屏：播放器吃掉剩余空间，选集区自己滚，整页不滚 */
      #detail:not([hidden]) {
        display: flex; flex-direction: column; height: calc(100dvh - 24px); overflow: hidden;
      }
      #detail > * { flex: none; }
      #detail > .bar, #detail > .meta, #detail > .desc, #detail > .error { flex: none; min-height: 0; }
      /* 画面按容器伸缩，别再用 9:16 + 65vh 撑破窄面板 */
      #detail > #player { flex: 1 1 auto; min-height: 140px; }
      #detail > #player video { width: 100%; height: 100%; max-height: 100%; aspect-ratio: auto; object-fit: contain; }
      #detail > .desc {
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      #detail > .eps {
        flex: 0 0 auto; max-height: 42%; min-height: 96px;
        overflow-y: auto; overscroll-behavior: contain; align-content: start;
      }
      /* 集号跟正文同色：详情页底色可能是播放器的黑，别再用会给成近黑的 --foreground */
      #detail > .eps button { color: inherit; }
      #detail > .eps button.seen:not(.on) { color: color-mix(in oklch, currentColor 60%, transparent); }
      #detail > .eps button:disabled { color: inherit; opacity: 0.35; }
      .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); grid-auto-rows: 30px; gap: 4px; margin-top: 12px; }
      .eps button {
        height: 30px; padding: 0; border: 0; border-radius: var(--radius-md);
        font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums;
        color: var(--foreground); background: transparent; cursor: pointer;
        transition: color var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-spring);
      }
      .eps button:hover:active { transform: scale(var(--press-scale)); }
      .eps button.seen:not(.on) { color: var(--muted-foreground); }
      .eps button.on { color: var(--hg); font-weight: 600; background: color-mix(in oklch, var(--hg) 12%, transparent); }
      .eps button:disabled { opacity: 0.3; cursor: default; }

      #historyList { display: flex; flex-direction: column; gap: 2px; }
      .row { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: var(--radius-lg); cursor: pointer; }
      .row .img { width: 44px; flex: none; }
      .row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .row .info .t { margin: 0; -webkit-line-clamp: 1; }
      .row .x { opacity: 0; transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out), transform var(--dur-2) var(--ease-spring); }
      .row:hover .x, .row .x:focus-visible { opacity: 1; }
      .prog { height: 3px; margin-top: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; }
      .prog i { display: block; height: 100%; border-radius: inherit; background: var(--hg); }
      .cache { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px; }
      .cache .muted { flex: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>

    <section id="home">
      <div class="bar" id="bar">
        <label class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="q" class="ui-input" type="search" placeholder="搜索短剧，回车" />
        </label>
        <button id="refresh" class="ui-btn ui-btn--icon" type="button" data-tip="换一批" aria-label="换一批">
          <svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9.7 9.7 0 0 1-6.7-2.7L3 16" /><path d="M3 21v-5h5" /><path d="M3 12a9 9 0 0 1 9-9 9.7 9.7 0 0 1 6.7 2.7L21 8" /><path d="M16 3h5v5" /></svg>
        </button>
      </div>
      <!-- 推荐高光：漫剧 / 真人剧 / 推荐，一条一屏 -->
      <div id="reel" hidden>
        <video id="reelVideo" playsinline></video>
        <div class="reel-tabs" id="reelTabs">
          <div class="reel-tabs-ch">
            <button type="button" data-ch="漫剧">漫剧</button>
            <button type="button" data-ch="真人剧">真人剧</button>
            <button type="button" data-ch="推荐" class="on">推荐</button>
          </div>
          <button id="openSearch" class="reel-search" type="button" aria-label="搜索">
            <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
        </div>
        <button id="reelPlayBtn" class="reel-play" type="button" hidden aria-label="播放">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        </button>
        <div class="reel-hint" id="reelHint"></div>
        <div class="reel-side">
          <div class="reel-stat" id="reelHeat"></div>
          <button id="reelMute" class="reel-mute" type="button" data-muted="0" aria-label="静音切换">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" /><path d="M16 9a4 4 0 0 1 0 6" /></svg>
          </button>
        </div>
        <div class="reel-meta">
          <div class="reel-rec" id="reelRec"></div>
          <div class="reel-title" id="reelTitle"></div>
          <div class="reel-tags" id="reelTags"></div>
          <div class="reel-desc" id="reelDesc"></div>
          <div class="reel-row">
            <button id="reelOpen" class="reel-watch" type="button">观看完整剧</button>
            <button id="reelSkip" class="reel-skip" type="button">下一个</button>
          </div>
        </div>
        <div class="reel-prog" id="reelProg" role="slider" aria-label="播放进度"><div class="fill" id="reelProgFill"></div></div>
      </div>
      <div id="recent" hidden>
        <div class="head">
          <h3>继续观看</h3>
          <button class="ui-btn ui-btn--sm" id="allHistory" type="button">全部<svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></button>
        </div>
        <div class="grid ui-stagger" id="recentGrid"></div>
        <h3 style="margin-top: 18px" id="listTitle">推荐</h3>
      </div>
      <div id="homeError" class="ui-empty"></div>
      <div class="grid ui-stagger" id="grid"></div>
      <button id="more" class="more ui-btn ui-btn--outline" type="button" hidden>加载更多</button>
    </section>

    <section id="history" hidden>
      <div class="bar">
        <button id="historyBack" class="ui-btn ui-btn--icon" type="button" data-tip="返回" hidden>
          <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span class="title">观看历史</span>
        <button id="clearHistory" class="ui-btn ui-btn--sm ui-btn--destructive" type="button">清空</button>
      </div>
      <div class="cache">
        <span class="muted" id="cacheInfo">缓存计算中…</span>
        <button id="clearCache" class="ui-btn ui-btn--sm ui-btn--outline" type="button" hidden>清理缓存</button>
      </div>
      <div id="historyList"></div>
    </section>

    <section id="detail" hidden>
      <div class="bar">
        <button id="back" class="ui-btn ui-btn--icon" type="button" data-tip="返回">
          <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span class="title" id="seriesTitle"></span>
      </div>
      <div id="player"><video id="video" playsinline autoplay></video></div>
      <div class="meta">
        <span class="muted ui-mono" id="status"></span>
        <label class="toggle"><input type="checkbox" class="ui-switch" id="auto" checked /> 自动下一集</label>
      </div>
      <div id="playError" class="error"></div>
      <div class="desc" id="desc"></div>
      <div class="eps" id="eps"></div>
    </section>
    <nav class="tabbar" id="nav">
      <button id="reset" type="button" aria-pressed="false">首页</button>
      <button id="homeFeed" type="button" aria-pressed="true">推荐</button>
      <button id="openHistory" type="button" aria-pressed="false">历史</button>
    </nav>

    <script src="enso-ui.js"></script>
    <script src="player.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      // 插件这边没人设 data-theme：系统深色时 body 透出黑底，
      // 而文字还在用浅色主题的近黑色，选集、描述几乎看不见。
      const darkMQ = matchMedia('(prefers-color-scheme: dark)');
      const applyTheme = () => { document.documentElement.dataset.theme = darkMQ.matches ? 'dark' : 'light'; };
      applyTheme();
      darkMQ.addEventListener('change', applyTheme);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // video.load() / 切集 会把 SourceBuffer 从 MediaSource 卸掉；后续 appendBuffer 会抛 InvalidStateError。
      const mseIdle = (sb) => new Promise((r) => {
        try {
          if (!sb.updating) return r();
          const done = () => { try { sb.removeEventListener('updateend', done); sb.removeEventListener('error', done); } catch {} r(); };
          sb.addEventListener('updateend', done, { once: true });
          sb.addEventListener('error', done, { once: true });
        } catch { r(); }
      });
      const mseDead = (e) =>
        e?.name === 'InvalidStateError' || /removed from the parent media source/i.test(String(e?.message || ''));
      const tryPlay = (v, ms = 200) => Promise.race([
        v.play().then(() => true, () => false),
        sleep(ms).then(() => false),
      ]);
      const store = {
        get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
      };

      // Host allows 10 UI calls/s per plugin; pace calls and let playback jump the queue.
      const queue = [];
      let pumping = false;
      const call = (method, args, priority = 1) =>
        new Promise((resolve, reject) => {
          queue.push({ method, args, priority, resolve, reject, tries: 0 });
          queue.sort((a, b) => a.priority - b.priority);
          pump();
        });
      async function pump() {
        if (pumping) return;
        pumping = true;
        while (queue.length) {
          const job = queue.shift();
          enso.call(job.method, job.args).then(job.resolve, async (e) => {
            if (/频繁|RATE_LIMITED|连续失败|CIRCUIT/.test(e.message) && job.tries++ < 20) {
              await sleep(/连续失败|CIRCUIT/.test(e.message) ? 3000 : 400);
              queue.unshift(job);
              pump();
            } else job.reject(e);
          });
          await sleep(120);
        }
        pumping = false;
      }

      // ---------- covers ----------
      const covers = new Map();
      const coverQueue = [];
      let coverBusy = 0;
      const observer = new IntersectionObserver((entries) => {
        for (const en of entries) if (en.isIntersecting) { observer.unobserve(en.target); coverQueue.push(en.target); }
        drainCovers();
      }, { rootMargin: '200px' });
      async function drainCovers() {
        while (coverBusy < 2 && coverQueue.length) {
          const el = coverQueue.shift();
          const url = el.dataset.cover;
          coverBusy++;
          (covers.has(url) ? Promise.resolve(covers.get(url)) : call('cover', { url }, 2).catch(() => null))
            .then((data) => {
              if (data) { covers.set(url, data); el.style.backgroundImage = `url("${data}")`; }
            })
            .finally(() => { coverBusy--; drainCovers(); });
        }
      }

      // 商城的「推荐」里有些条目没带 episode_count，卡片角标就空着。
      // 补一次分集数，按剧 id 缓存，别每次刷新都重问。
      const countCache = new Map();
      async function fillCardCount(s, put) {
        if (countCache.has(s.id)) {

      // ---------- home ----------
      const SHOWN_MAX = 500;

      let feed = { method: 'discover', channel: '', q: '', cursor: '', seen: new Set(), blocked: new Set(), token: 0 };

      const feedCursorKey = (f) => (f.method === 'discover' ? `feedCursor:${f.channel || '-'}` : '');

            if (token !== feed.token) return;

      // ---------- 首页高光流 ----------
      // 一条一屏，播的是该剧第 1 集（红果 App 首页的「高光」就是这个）。
      // 播完自动进详情接着看；也可以点「看全集」提前进，或点「下一个」跳过。
      let reels = { items: [], i: 0, token: 0, series: null, ms: null, channel: '推荐' };
      const reelV = () => $('reelVideo');
      const reelSyncMute = () => {

      async function reelStart(v) {

        const vol = store.get('hp-volume', { v: 1, m: false });
        v.volume = typeof vol.v === 'number' ? vol.v : 1;
        const want = !vol.m && v.volume > 0;
        if (want) {
          // 先静音起播：这一步不会被策略拦，画面立刻能出。
          v.muted = true;

          v.muted = false;

          return 'blocked';
        }

        return ok ? 'muted' : 'blocked';
      }
      const reelDur = () => {
        const v = reelV();

        const s = v.seekable;
        return s.length ? s.end(s.length - 1) : 0;
      };
      function reelProgress() {
        const v = reelV();
        const d = reelDur();

        const r = $('reelProg').getBoundingClientRect();
        const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        v.currentTime = Math.min(d - 0.05, p * d);
        $('reelProgFill').style.width = `${p * 100}%`;
      };

        const v = $('reelVideo');
        for (const ev of ['loadedmetadata', 'durationchange', 'progress', 'timeupdate', 'seeked']) v.addEventListener(ev, reelProgress);

        bar.addEventListener('pointercancel', stopDrag);
      }
      const reelAhead = () => {

      };
      async function reelAppend(sb, bytes, token) {
        for (;;) {
          if (token !== reels.token) return;
          await mseIdle(sb);
          if (token !== reels.token) return;
          try {
            sb.appendBuffer(bytes);
            await mseIdle(sb);

          } catch (e) {
            if (token !== reels.token || mseDead(e)) return;
            if (e.name !== 'QuotaExceededError') throw e;
          }
          try {
            const behind = reelV().currentTime - 10;
            if (sb.buffered.length && behind > sb.buffered.start(0)) { sb.remove(0, behind); await mseIdle(sb); }
          } catch {
            return;
          }
          await sleep(1000);
          if (token !== reels.token) return;
        }
      }
      function reelStop() {
        reels.token++;

        const stale = () => ch !== (reels.channel || '推荐') || $('reel').hidden;

          }
          if (stale()) return [];
          for (const s of page.items ?? []) {

            seen.add(s.id);
            if (seenBefore.has(s.id)) soft.push(s);
            else out.push(s);
          }
          cursor = page.cursor ?? '';
          more = Boolean(page.hasMore);
        }
        // 到头了就重置，下次从新的一轮开始；否则记住位置接着往后翻

        // 看过的只用来垫底，而且最多占三分之一：

        const softQuota = Math.max(0, Math.min(soft.length, target - out.length, Math.max(3, Math.ceil(target / 3))));

          return fillReels(stale, target);

      async function reelPlay(i) {

        $('reelRec').textContent = s.rec || (s.play ? `${wan(s.play)}人在追` : '');
        $('reelHint').textContent = '加载中…';
        $('reelPlayBtn').hidden = true;
        const tags = String(s.category || '').split(/[·,，\s]+/).filter(Boolean).slice(0, 4);
        $('reelTags').replaceChildren(...tags.map((t) => { const el = document.createElement('span'); el.textContent = t; return el; }));
        $('reelDesc').textContent = s.description ? `第1集 | ${s.description}` : '';
        $('reelDesc').classList.remove('open');
        $('reelOpen').textContent = s.count ? `观看完整剧 · 全${s.count}集` : '观看完整剧';
        $('reelHeat').innerHTML = s.play
          ? `<svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 0 0 9-9c0-4-3-8-9-11C6 4 3 8 3 12a9 9 0 0 0 9 9z" /></svg>${wan(s.play)}`
          : '';
        try {
          // 首页卡片自带的 vid 就是第 1 集的 episodeId（实测一致），直接播，省掉一次分集请求
          let epId = s.vid ? String(s.vid) : '';
          if (!epId) {
            const rows = await call('episodes', { seriesId: s.id });
            if (token !== reels.token) return;
            const eps = rows.map(([id, number, playable, title]) => ({ id, number, playable: Boolean(playable), title }));
            epId = eps.find((e) => e.playable)?.id ?? '';
          }
          if (!epId) { $('reelHint').textContent = '这部剧暂时没有可播放的分集'; return; }
          const info = await call('open', { episodeId: epId, quality }, 0);
          if (token !== reels.token) return;
          const mime = mimeOf(info.codec);
          if (!mime) { $('reelHint').textContent = '这部剧的编码浏览器播不了，换低清晰度或划走'; return; }
          const MS = window.ManagedMediaSource || window.MediaSource;
          let sb = null;
          let ms = null;
          const parts = [];
          if (MS && MS.isTypeSupported(mime)) {
            ms = new MS();
            reels.ms = ms;
            if (window.ManagedMediaSource && ms instanceof ManagedMediaSource) v.disableRemotePlayback = true;
            try { v.srcObject = ms; } catch { v.src = URL.createObjectURL(ms); }
            await new Promise((r) => ms.addEventListener('sourceopen', r, { once: true }));
            if (token !== reels.token) return;
            sb = ms.addSourceBuffer(mime);
          }
          let offset = 0;
          let kicked = false;
          const kick = async () => {
            if (kicked || token !== reels.token) return;
            kicked = true;
            const r = await reelStart(v);
            if (token !== reels.token) return;
            if (r === 'ok') {
              $('reelHint').textContent = '';
              $('reelPlayBtn').hidden = true;
            } else if (r === 'muted') {
              $('reelPlayBtn').hidden = true;
              // 只提示一次：每条都弹一遍太吵，喇叭图标本身就能看出状态
              if (!store.get('reelMuteHinted', false)) {
                store.set('reelMuteHinted', true);
                $('reelHint').textContent = '静音播放中 · 点喇叭开启声音';
                setTimeout(() => {
                  if ($('reelHint').textContent.startsWith('静音播放中')) $('reelHint').textContent = '';
                }, 4000);
              }
            } else {
              $('reelHint').textContent = '点击播放';
              $('reelPlayBtn').hidden = false;
            }
          };
          for (;;) {
            if (token !== reels.token) return;
            if (sb && reelAhead() > 60) { await sleep(800); continue; }
            const r = await call('chunk', { episodeId: info.episodeId, definition: info.definition, offset }, 0);
            if (token !== reels.token) return;
            if (r.data) {
              const bytes = b64(r.data);
              if (sb) await reelAppend(sb, bytes, token);
              else parts.push(bytes);
              offset = r.next;
              if (sb) kick();
            }
            if (r.done) break;
          }
          if (token !== reels.token) return;
          if (sb) {
            await mseIdle(sb);
            if (token !== reels.token) return;
            try { if (ms.readyState === 'open') ms.endOfStream(); } catch {}
          } else {
            v.src = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
          }
          await kick();
        } catch (e) {
          if (token === reels.token) $('reelHint').textContent = e.message;
        }
      }
      $('reelVideo').addEventListener('playing', () => {
        const t = $('reelHint').textContent;
        if (t === '加载中…' || t === '点击播放') $('reelHint').textContent = '';
        $('reelPlayBtn').hidden = true;
      });
      $('reelVideo').addEventListener('pause', () => {
        if (!$('reel').hidden) $('reelPlayBtn').hidden = false;
      });
      $('reelVideo').onclick = () => {
        const v = reelV();
        if (v.muted) {
          v.muted = false;
          reelSyncMute();
          store.set('hp-volume', { v: v.volume, m: false });
          if ($('reelHint').textContent.startsWith('静音播放中')) $('reelHint').textContent = '';
          if (v.paused) v.play().catch(() => {});
          return;
        }
        if (v.paused) v.play().catch(() => {}); else v.pause();
      };
      $('reelMute').onclick = (e) => {
        e.stopPropagation();
        const v = reelV();
        v.muted = !v.muted;
        if (!v.muted) v.play().catch(() => {});
        reelSyncMute();
        store.set('hp-volume', { v: v.volume, m: v.muted });
        if (v.muted) $('reelHint').textContent = '已静音';
        else if ($('reelHint').textContent.startsWith('静音播放中')) $('reelHint').textContent = '';
      };
      $('reelPlayBtn').onclick = (e) => { e.stopPropagation(); reelV().play().catch(() => {}); };
      $('reelOpen').onclick = () => {
        const s = reels.series;
        if (!s) return;
        openSeries(s);
      };
      $('reelDesc').onclick = () => $('reelDesc').classList.toggle('open');
      $('openSearch').onclick = () => {
        showFeed();
        $('q').focus();
      };
      $('reelTabs').onclick = (e) => {
        const b = e.target.closest('button[data-ch]');
        if (!b || b.dataset.ch === reels.channel) return;
        reels.channel = b.dataset.ch;
        for (const x of document.querySelectorAll('.reel-tabs-ch button')) x.classList.toggle('on', x === b);
        enterReels();
      };
      const reelNext = () => {
        if ($('reel').hidden) return;
        if (reels.i + 1 < reels.items.length) reelPlay(reels.i + 1);
        else enterReels();
      };
      $('reelSkip').onclick = () => reelNext();
      $('reel').addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) < 40) return;
        e.preventDefault();
        if (e.deltaY > 0) reelNext();
        else if (reels.i > 0) reelPlay(reels.i - 1);
      }, { passive: false });
      $('reelVideo').addEventListener('ended', () => {
        if ($('reel').hidden) return;
        reelNext();
      });

      $('homeFeed').onclick = () => {
        // 从历史页点过来要真的切回列表并重新拉首页流，否则只是把旧列表露出来
        if (!$('history').hidden) show(false);
        enterReels();
      };
      $('refresh').onclick = () => showFeed();
      $('more').onclick = () => loadFeed(false);

      // ---------- detail / player ----------
      const video = $('video');
      let series = null;
      let episodes = [];
      let current = null;
      let playToken = 0;
      // 每个会话的侧栏各有一个页面实例；主进程记录唯一在播的实例，其余实例露面时接力
      const inst = Math.random().toString(36).slice(2);
      let owned = false;
      let dirty = false;
      let wantPlay = false;
      const sync = (args) => {
        const a = { inst, ...args };
        if (dirty) { a.recent = loadHistory(); dirty = false; }
        return call('sync', a, 0);
      };
      const snap = () =>
        series && current
          ? {
              series: { id: series.id, title: series.title, description: series.description?.slice(0, 300), cover: series.cover, count: series.count },
              epId: current.id,
              time: pos,
              playing: wantPlay,
            }
          : null;
      const claim = () => {
        owned = true;
        sync({ claim: true, state: snap() }).catch(() => {});
      };
      const QUALITIES = ['360p', '480p', '540p', '720p', '1080p'];
      let quality = store.get('quality', '720p');
      if (!QUALITIES.includes(quality)) quality = '720p';
      $('auto').checked = store.get('auto', true);
      $('auto').onchange = () => store.set('auto', $('auto').checked);
      const nextOf = (ep) => ep && episodes.find((e) => e.number > ep.number && e.playable);
      const player = createPlayer($('player'), video, {
        qualities: QUALITIES,
        quality: () => quality,
        setQuality: (q) => {
          quality = q;
          store.set('quality', q);
          if (current) play(current, video.currentTime);
        },
        onNext: () => {
          const next = nextOf(current);
          if (next) play(next);
        },
        duration: () => dur,
      });

      // 详情页期间先把高光层收起来：否则 body 的 :has(#reel) 规则
      // 会把整页当成播放页套上黑底，浅色主题的文字就看不见了。
      let reelParked = false;
      function show(detail) {
        $('home').hidden = detail;
        $('history').hidden = true;
        $('detail').hidden = !detail;
        if (detail) {
          reelStop();
          if (!$('reel').hidden) {
            reelParked = true;
            $('reel').hidden = true;
            $('bar').hidden = false;
            $('grid').hidden = false;
            $('more').hidden = true;
            $('homeError').hidden = false;
          }
        }
        syncNav();
        if (!detail) {
          stop();
          if (reelParked) {
            reelParked = false;
            setReelMode(true);
            if (reels.items.length) reelPlay(reels.i);
          } else if (!$('reel').hidden && reels.items.length) reelPlay(reels.i);
          else renderRecent();
        }
        window.scrollTo(0, 0);
      }
      $('back').onclick = () => show(false);

      async function openSeries(s, resume) {
        series = s;
        episodes = [];
        current = null;
        $('seriesTitle').textContent = s.title;
        $('desc').textContent = s.description || '';
        $('eps').replaceChildren();
        $('playError').textContent = '';
        $('status').textContent = '加载分集…';
        show(true);
        try {
          const rows = await call('episodes', { seriesId: s.id });
          episodes = rows.map(([id, number, playable, title]) => ({ id, number, playable: Boolean(playable), title }));
        } catch (e) {
          $('playError').textContent = e.message;
          return;
        }
        if (series !== s) return;
        const last = loadHistory().find((r) => r.id === s.id);
        const seen = new Set(last?.watched ?? []);
        $('eps').replaceChildren(
          ...episodes.map((ep) => {
            const b = document.createElement('button');
            b.textContent = ep.number;
            b.type = 'button';
            b.dataset.fill = '';
            b.title = ep.title || `第${ep.number}集`;
            b.disabled = !ep.playable;
            b.dataset.id = ep.id;
            b.classList.toggle('seen', seen.has(ep.number));
            b.onclick = () => play(ep, resumeAt(ep));
            return b;
          })
        );
        if (resume) {
          const ep = episodes.find((e) => e.id === resume.epId && e.playable);
          if (ep) return play(ep, resume.time, !resume.playing);
        }
        let ep = episodes.find((e) => e.number === last?.number && e.playable);
        // last episode was finished: continue from the next one
        if (ep && last.duration && last.time >= last.duration - 3) ep = episodes.find((e) => e.number > ep.number && e.playable) ?? ep;
        ep ??= episodes.find((e) => e.playable);
        if (ep) play(ep, resumeAt(ep));
        else $('status').textContent = '没有可播放的分集';
      }

      function resumeAt(ep) {
        const h = loadHistory().find((r) => r.id === series?.id);
        if (!h || h.number !== ep.number || !h.time) return 0;
        return h.duration && h.time >= h.duration - 3 ? 0 : h.time;
      }

      // pos only tracks real playback of `current`; src swaps reset currentTime and must not overwrite it
      let pos = 0;
      let dur = 0;
      function remember({ finished = false } = {}) {
        if (!series || !current || !owned) return;
        const list = loadHistory();
        const prev = list.find((r) => r.id === series.id);
        const watched = new Set(prev?.watched ?? []);
        const duration = Math.floor(dur || 0);
        if (finished || (duration && pos >= duration * 0.9)) watched.add(current.number);
        const entry = {
          id: series.id,
          title: series.title,
          description: series.description?.slice(0, 120),
          cover: series.cover,
          count: episodes.length || series.count || prev?.count,
          number: current.number,
          time: Math.floor(finished ? duration : pos),
          duration,
          at: Date.now(),
          watched: [...watched].sort((a, b) => a - b),
        };
        saveHistory([entry, ...list.filter((r) => r.id !== series.id)]);
        const b = [...$('eps').children].find((x) => x.dataset.id === current.id);
        if (b && watched.has(current.number)) b.classList.add('seen');
      }
      const tracking = () => !video.seeking && video.readyState >= 2 && video.getAttribute('src');
      video.addEventListener('pause', () => {
        if (tracking()) { pos = video.currentTime; wantPlay = false; remember(); }
      });
      video.addEventListener('play', () => {
        wantPlay = true;
        if (!owned && current) claim();
      });
      let lastSave = 0;
      video.addEventListener('timeupdate', () => {
        if (!tracking()) return;
        pos = video.currentTime;
        if (Date.now() - lastSave > 5000) { lastSave = Date.now(); remember(); }
      });
      window.addEventListener('pagehide', () => remember());
      video.addEventListener('ended', () => {
        if (!current) return;
        remember({ finished: true });
        if (!$('auto').checked) return;
        const next = nextOf(current);
        if (next) {
          player.flash(`第${next.number}集`);
          play(next);
        }
      });

      function stop() {
        remember();
        if (owned) {
          sync({ state: null }).catch(() => {});
          owned = false;
        }
        current = null;
        playToken++;
        player.exitFull();
        video.pause();
        video.srcObject = null;
        video.removeAttribute('src');
        video.load();
      }

      const mimeOf = (codec) => {
        const c = String(codec || '');
        const v = /^(hvc1|hev1)$/i.test(c) ? `${c}.1.6.L120.90` : /^(avc1|avc3)$/i.test(c) ? 'avc1.64001f' : '';
        return v ? `video/mp4; codecs="${v},mp4a.40.2"` : '';
      };
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      async function append(sb, bytes, token) {
        for (;;) {
          if (token !== playToken) return;
          await mseIdle(sb);
          if (token !== playToken) return;
          try {
            sb.appendBuffer(bytes);
            return mseIdle(sb);
          } catch (e) {
            if (token !== playToken || mseDead(e)) return;
            if (e.name !== 'QuotaExceededError') throw e;
          }
          try {
            const behind = video.currentTime - 10;
            if (sb.buffered.length && behind > sb.buffered.start(0)) { sb.remove(0, behind); await mseIdle(sb); }
          } catch {
            return;
          }
          await sleep(1000);
          if (token !== playToken) return;
        }
      }
      const ahead = () => {
        const b = video.buffered;
        return b.length ? b.end(b.length - 1) - video.currentTime : 0;
      };

      async function play(ep, startAt = 0, paused = false) {
        if (current && current.id !== ep.id) remember();
        const token = ++playToken;
        current = ep;
        pos = startAt;
        wantPlay = !paused;
        video.autoplay = !paused;
        claim();
        player.setTitle(`第${ep.number}集${ep.title ? ` · ${ep.title}` : ''}`, series?.title ?? '');
        player.setHasNext(Boolean(nextOf(ep)));
        player.loading(true);
        const h = loadHistory().find((r) => r.id === series?.id);
        dur = h?.number === ep.number ? h.duration || 0 : 0;
        for (const b of $('eps').children) {
          b.classList.toggle('on', b.dataset.id === ep.id);
          if (b.dataset.id === ep.id) b.scrollIntoView({ block: 'nearest' });
        }
        $('playError').textContent = '';
        $('status').textContent = `第${ep.number}集 · 解析中…`;
        remember();
        let info;
        try {
          info = await call('open', { episodeId: ep.id, quality }, 0);
        } catch (e) {
          if (token === playToken) { $('playError').textContent = e.message; $('status').textContent = ''; player.loading(false); }
          return;
        }
        if (token !== playToken) return;
        if (info.duration) dur = info.duration;
        const label = `第${ep.number}集 · ${info.definition}`;
        const mime = mimeOf(info.codec);
        if (!mime) {
          $('playError').textContent = '这部剧的编码浏览器播不了，换低清晰度或换一集';
          $('status').textContent = '';
          player.loading(false);
          return;
        }
        const MS = window.ManagedMediaSource || window.MediaSource;
        const useMse = MS && MS.isTypeSupported(mime);
        let sb = null;
        let ms = null;
        const parts = [];
        if (useMse) {
          ms = new MS();
          if (window.ManagedMediaSource && ms instanceof ManagedMediaSource) video.disableRemotePlayback = true;
          // WebKit rejects MediaSource blob URLs in opaque-origin (sandboxed) frames; Chromium rejects MediaSource as srcObject.
          try { video.srcObject = ms; } catch { video.src = URL.createObjectURL(ms); }
          await new Promise((r) => ms.addEventListener('sourceopen', r, { once: true }));
          if (token !== playToken) return;
          sb = ms.addSourceBuffer(mime);
          if (startAt) video.currentTime = startAt;
        }
        let offset = 0;
        let kicked = false;
        const kick = async () => {
          if (kicked || token !== playToken) return;
          kicked = true;
          if (!wantPlay) { player.loading(false); return; }
          if (!(await tryPlay(video))) player.loading(false);
        };
        try {
          for (;;) {
            if (token !== playToken) return;
            if (sb && ahead() > 90) { await sleep(1000); continue; }
            const r = await call('chunk', { episodeId: info.episodeId, definition: info.definition, offset }, 0);
            if (token !== playToken) return;
            if (r.data) {
              const bytes = b64(r.data);
              if (sb) await append(sb, bytes, token);
              else parts.push(bytes);
              offset = r.next;
              $('status').textContent = `${label} · 已缓冲 ${(offset / 1048576).toFixed(1)}MB`;
              if (sb) kick();
            }
            if (r.done) break;
          }
          if (sb) {
            await mseIdle(sb);
            if (token !== playToken) return;
            try { if (ms.readyState === 'open') ms.endOfStream(); } catch {}
          } else {
            video.srcObject = null;
            video.src = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
            if (startAt) video.currentTime = startAt;
          }
          $('status').textContent = label;
          await kick();
          prefetch(ep);
        } catch (e) {
          if (token === playToken) $('playError').textContent = e.message;
        }
      }

      function prefetch(ep) {
        if (!$('auto').checked) return;
        const next = episodes.find((e) => e.number > ep.number && e.playable);
        if (next) call('open', { episodeId: next.id, quality }, 1).catch(() => {});
      }

      video.addEventListener('error', () => {
        if (video.getAttribute('src') || video.srcObject) $('playError').textContent = `播放失败：${video.error?.message || video.error?.code || ''}`;
      });
      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth) video.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
      });
      video.addEventListener('durationchange', () => {
        if (Number.isFinite(video.duration) && video.duration > 0) dur = video.duration;
      });

      // 被别的实例接管：停下并让出下载
      function yieldTo() {
        owned = false;
        playToken++;
        video.pause();
        player.loading(false);
      }
      let adopting = false;
      async function adopt() {
        if (adopting) return;
        adopting = true;
        const r = await sync({ pull: true }).catch(() => null);
        adopting = false;
        if (!r || r.own) return;
        if (Array.isArray(r.recent)) store.set('recent', r.recent);
        const n = r.now;
        if (!n?.series) {
          if (!$('home').hidden) renderRecent();
          return;
        }
        const ep = series?.id === n.series.id && episodes.find((e) => e.id === n.epId);
        if (ep && !$('detail').hidden) play(ep, n.time, !n.playing);
        else openSeries(n.series, n);
      }
      setInterval(() => {
        if (owned && snap()) sync({ state: snap() }).then((r) => r.own || yieldTo(), () => {});
        else if (dirty) sync({}).catch(() => {});
      }, 1000);
      // display:none 的面板不跑 rAF：长时间断帧后恢复说明面板重新露面
      let lastFrame = performance.now();
      requestAnimationFrame(function tick(t) {
        if (t - lastFrame > 1000) adopt();
        lastFrame = t;
        requestAnimationFrame(tick);
      });

      ensoUI.tooltip();
      ensoUI.fill($('eps'));
      ensoUI.fill($('historyList'));
      syncNav();
      renderRecent();
      enterReels();
      adopt();
    </script>
  </body>
</html>
