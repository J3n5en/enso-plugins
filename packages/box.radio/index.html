<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Box Radio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--background, #fafafa);
        --fg: var(--foreground, #18181b);
        --muted-bg: var(--muted, #f4f4f5);
        --muted-fg: var(--muted-foreground, #71717a);
        --line: var(--border, #e4e4e7);
        --accent: var(--primary, #18181b);
        --accent-fg: var(--primary-foreground, #fafafa);
      }
      :root[data-theme='dark'] {
        --bg: var(--background, #09090b);
        --fg: var(--foreground, #fafafa);
        --muted-bg: var(--muted, #27272a);
        --muted-fg: var(--muted-foreground, #a1a1aa);
        --line: var(--border, #27272a);
        --accent: var(--primary, #fafafa);
        --accent-fg: var(--primary-foreground, #18181b);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--fg);
        background: transparent;
      }
      header {
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      input[type='search'] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        outline: none;
      }
      input[type='search']:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .tabs button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-fg);
        border-radius: 6px;
        padding: 3px 10px;
        font: inherit;
        cursor: pointer;
      }
      .tabs button.on {
        color: var(--fg);
        border-color: var(--line);
        background: var(--muted-bg);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        max-height: 88px;
        overflow: auto;
      }
      .chips[hidden],
      .region-bar[hidden] {
        display: none !important;
      }
      .foot-av[hidden] { display: none !important; }
      .chips button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
        background: transparent;
        color: var(--muted-fg);
        font: inherit;
        cursor: pointer;
      }
      .chips button.on {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .region-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .region-bar button.on {
        border: 1px solid var(--fg);
        border-radius: 999px;
        padding: 2px 10px;
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        cursor: pointer;
      }
      .region-bar .caret {
        width: 28px;
        padding: 2px 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted-fg);
        font: inherit;
        cursor: pointer;
        line-height: 1.2;
      }
      .region-bar .caret.open { color: var(--fg); }
      .msg {
        padding: 16px 12px;
        color: var(--muted-fg);
        text-align: center;
      }
      .msg button {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
      }
      .list {
        flex: 1;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: default;
      }
      .row:hover { background: var(--muted-bg); }
      .row.playing {
        box-shadow: inset 2px 0 0 var(--fg);
      }
      .row.playing .name { font-weight: 600; }
      .row.dead { cursor: default; opacity: 0.72; }
      .row:not(.dead) .av,
      .row:not(.dead) .name,
      .star {
        cursor: pointer !important;
      }
      .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--muted-bg);
        color: var(--muted-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        flex: 0 0 32px;
        position: relative;
      }
      .av img { width: 100%; height: 100%; object-fit: cover; }
      .av-badge {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--fg) 28%, transparent);
        opacity: 0;
        pointer-events: none;
      }
      .row:not(.dead) .av:hover .av-badge,
      .row.playing .av-badge {
        opacity: 1;
      }
      .av-eq {
        display: none;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .row.playing .av-eq { display: flex; }
      .row.playing .av:hover .av-eq { display: none; }
      .av-eq span {
        display: block;
        width: 2px;
        height: 12px;
        background: var(--bg);
        transform-origin: center bottom;
        animation: av-eq 0.8s ease-in-out infinite;
      }
      .av-eq span:nth-child(2) { animation-delay: 0.12s; }
      .av-eq span:nth-child(3) { animation-delay: 0.24s; }
      @keyframes av-eq {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      .av-play {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5px 0 5px 8px;
        border-color: transparent transparent transparent var(--bg);
        margin-left: 2px;
        display: none;
      }
      .row:not(.playing):not(.dead) .av:hover .av-play { display: block; }
      .av-pause {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 10px;
      }
      .av-pause span {
        display: block;
        width: 2px;
        height: 10px;
        background: var(--bg);
      }
      .row.playing .av:hover .av-pause { display: flex; }
      @media (prefers-reduced-motion: reduce) {
        .av-eq span { animation: none; transform: scaleY(0.65); }
      }
      .meta { flex: 1; min-width: 0; }
      .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: var(--muted-fg); font-size: 11px; }
      .star {
        border: 0;
        background: transparent;
        color: var(--muted-fg);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        line-height: 1;
      }
      .star.on { color: #ca8a04; }
      footer {
        border-top: 1px solid var(--line);
        padding: 8px 12px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: color-mix(in srgb, var(--fg) 8%, var(--bg, transparent));
      }
      .foot-av {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: var(--muted-bg);
        color: var(--muted-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        flex: 0 0 32px;
      }
      .foot-av img { width: 100%; height: 100%; object-fit: cover; }
      .now-wrap {
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      footer .now {
        flex: none;
        min-width: 0;
        white-space: nowrap;
        overflow: visible;
        text-overflow: unset;
        color: var(--muted-fg);
      }
      footer .now.marquee {
        display: flex;
        width: max-content;
        animation: now-slide linear infinite;
      }
      footer .now.marquee span { padding-right: 2.5em; }
      @keyframes now-slide {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      footer .now.live { color: var(--fg); }
      footer button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 4px 8px;
        cursor: pointer;
      }
      footer .icon-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 32px;
      }
      footer .icon-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        display: block;
      }
      #toggle .i-pause { display: none; }
      #toggle.is-playing .i-play { display: none; }
      #toggle.is-playing .i-pause { display: block; }
      input[type='range'] { width: 72px; }
      .toast {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 56px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--muted-bg);
        color: var(--fg);
        border: 1px solid var(--line);
        font-size: 12px;
        text-align: center;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        footer .now.marquee { animation: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Box Radio</h1>
      <input id="q" type="search" placeholder="搜索电台" autocomplete="off" />
      <div class="tabs">
        <button type="button" id="tab-hot" class="on">热门</button>
        <button type="button" id="tab-cat">分类</button>
        <button type="button" id="tab-fav">收藏</button>
      </div>
      <div id="regionBar" class="region-bar" hidden>
        <button type="button" id="regionCurrent" class="on">广东</button>
        <button type="button" id="regionToggle" class="caret" aria-label="展开地区">▾</button>
      </div>
      <div id="chips" class="chips" hidden></div>
    </header>
    <ul id="list" class="list"></ul>
    <div id="empty" class="msg" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <footer>
      <div id="footAv" class="foot-av" hidden></div>
      <div class="now-wrap">
        <div id="now" class="now">未在播放</div>
      </div>
      <button type="button" id="toggle" class="icon-btn" aria-label="播放" disabled>
        <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 2.5v11l10-5.5L4 2.5z" />
        </svg>
        <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 2.5h3v11h-3zm6 0h3v11h-3z" />
        </svg>
      </button>
      <input id="vol" type="range" min="0" max="100" value="80" />
    </footer>
    <audio id="audio"></audio>
    <script src="ui.js"></script>
  </body>
</html>
