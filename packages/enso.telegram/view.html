<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <style>
      body { padding: 10px; font-size: 12px; }
      #app, #body { display: flex; flex-direction: column; gap: 8px; }
      #app > div:empty { display: none; }
      .card { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      h3 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
      b { font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .row.wrap { flex-wrap: wrap; gap: 6px 12px; }
      .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .m { color: var(--muted-foreground); font-size: 11px; }
      .err { color: var(--destructive); font-size: 11px; }
      .tabs { display: flex; gap: 4px; padding: 2px; background: var(--muted); border-radius: var(--radius-md); }
      .tab { flex: 1; height: 26px; border: 0; border-radius: calc(var(--radius-md) - 2px); background: none; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted-foreground); }
      .tab.on { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .rt { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
      .rt > .head { padding: 6px 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
      .rt > .head:hover { background: var(--muted); }
      .rt-toggle { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
      .rt.muted > .head .grow, .rt.muted > .head .sess-chip { opacity: .5; }
      .rt > .body { padding: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
      label.switch { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 11px; cursor: pointer; white-space: nowrap; }
      /* 标签 + 下拉框：标签不折行，下拉框吃掉剩余宽度；放不下时操作按钮整组折到下一行靠右，不挤压下拉框 */
      .field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
      .field-row > .lbl { white-space: nowrap; flex-shrink: 0; font-size: 12px; color: var(--foreground); }
      .field-row > select.ui-input { flex: 1 1 140px; min-width: 140px; height: 26px; font-size: 11px; }
      .field-row > .acts { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
      /* 禁用按钮 pointer-events:none 收不到悬停，tooltip 挂在外层 */
      .tip { display: inline-flex; }
      .sess-chip { flex-shrink: 1; min-width: 0; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--border); border-radius: var(--radius-md); background: none; padding: 1px 6px; font: inherit; font-size: 11px; color: var(--muted-foreground); cursor: pointer; }
      .sess-chip:hover { color: var(--foreground); background: var(--background); }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center; }
      .grid label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted-foreground); }
      .grid .ui-input, .grid select { height: 24px; font-size: 11px; }
      textarea.ui-input { font-size: 11px; min-height: 52px; resize: vertical; }
      .users { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .x { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; opacity: .6; font: inherit; }
      .x:hover { opacity: 1; }
      .code { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: 6px; text-align: center; padding: 10px 0; border-radius: var(--radius-md); background: var(--muted); user-select: all; }
      .btns { display: flex; gap: 6px; flex-wrap: wrap; }
      .btns > .ui-btn { flex: 1; height: 30px; }
      ol { margin: 0; padding-left: 18px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 2px; }
      details > summary { cursor: pointer; color: var(--muted-foreground); font-size: 11px; }
      .chat { display: flex; flex-direction: column; gap: 2px; }
      .topicrow { padding-left: 18px; }
      input[type=password].ui-input, input[type=text].ui-input { height: 28px; width: 100%; }
      .ui-btn--block { width: 100%; height: 30px; }
    </style>
  </head>
  <body>
    <div id="app"><div id="conn"></div><div id="tabs"></div><div id="body"><div class="ui-card card"><div class="ui-skeleton" style="height: 14px; width: 60%"></div></div></div><div id="err"></div></div>
    <script src="enso-ui.js"></script>
    <script>
      const app = document.getElementById('app');
      // 持久插槽：只在各自的 HTML 快照变化时重写，重绘不会销毁别的插槽里正在被点击的按钮
      const SLOTS = ['conn', 'tabs', 'body', 'err'];
      const slots = Object.fromEntries(SLOTS.map((id) => [id, document.getElementById(id)]));
      const snap = {};
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      let view = null;
      let error = '';
      let errorFrom = ''; // state：轮询失败，下一次轮询成功即清；action：用户操作失败，下一次用户操作才清
      let tab = 'routes';
      let changingToken = false; // 「更换 Token」展开态：轮询重绘不得把它折叠掉
      const openKeys = new Set(); // 展开编辑的路由
      ensoUI.tooltip();

      let last = '';
      let inflight = 0;
      let seq = 0;
      let applied = 0;
      let pressTarget = null; // 按下未松开的元素：它所在的插槽等点击结束再重绘
      const stale = new Set(); // 因正在输入/按下而推迟重绘的插槽
      // 开关和复选框点完就算完事，不算「正在输入」，否则状态变化要等失焦才画出来
      const editing = () => {
        const el = document.activeElement;
        if (el?.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'radio')) return false;
        return ['INPUT', 'TEXTAREA', 'SELECT'].includes(el?.tagName);
      };

      /** 轮询只在没有请求在途时发；用户操作永不被轮询吞掉。过期的响应不覆盖更新的视图。 */
      async function run(method, args) {
        const poll = method === 'state';
        if (poll && inflight) return;
        inflight += 1;
        const my = ++seq;
        let changed = false;
        try {
          const next = await window.enso.call(method, args ?? {});
          if (my < applied) return;
          applied = my;
          if (method === 'connect' && !next?.ok) {
            error = next?.message || '连接失败';
            errorFrom = 'action';
            changed = true;
          } else {
            if (method === 'connect') changingToken = false;
            const key = JSON.stringify(next);
            if (key !== last) {
              last = key;
              view = next;
              changed = true;
            }
            if (error && (!poll || errorFrom === 'state')) {
              error = '';
              changed = true;
            }
          }
        } catch (e) {
          error = e?.message ?? String(e);
          errorFrom = poll ? 'state' : 'action';
          changed = true;
        } finally {
          inflight -= 1;
          if (changed) render();
        }
      }
      const flushStale = () => { if (stale.size) render(); };
      document.addEventListener('focusout', () => setTimeout(flushStale));
      document.addEventListener('pointerdown', (e) => { pressTarget = e.target; }, true);
      const release = () => { pressTarget = null; setTimeout(flushStale); };
      document.addEventListener('pointerup', release, true);
      document.addEventListener('pointercancel', release, true);

      function sessOptions(selected) {
        const sessions = view.sessions ?? [];
        const groups = {};
        for (const s of sessions) {
          const g = s.kind === 'secretary' ? '秘书' : (s.projectName || '未分组');
          (groups[g] ??= []).push(s);
        }
        // 绑定的会话不在当前列表里（已归档/跨项目拿不到）时补一个占位项，避免下拉误显示成第一项
        const fallback = selected && !sessions.some((s) => s.id === selected)
          ? `<optgroup label="当前绑定"><option value="${esc(selected)}" selected>${esc(selected)}（不在会话列表）</option></optgroup>`
          : '';
        return fallback + Object.entries(groups).map(([g, list]) =>
          `<optgroup label="${esc(g)}">${list.map((s) => `<option value="${esc(s.id)}" ${s.id === selected ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</optgroup>`
        ).join('');
      }

      function routeCard(r) {
        const open = openKeys.has(r.key);
        const on = r.enabled !== false;
        const icon = r.chatType === 'private' ? '👤' : '👥';
        const topicBit = r.topicId ? ` <span class="m"># ${esc(r.topicName ?? r.topicId)}</span>` : '';
        const sess = r.sessionId
          ? `<button class="sess-chip" data-focus="${esc(r.sessionId)}" data-tip="跳到这个会话">${esc(r.session ?? r.sessionId)} ↗</button>`
          : '<span class="ui-badge ui-badge--warning">未绑会话</span>';
        const head = `<div class="head" data-toggle="${esc(r.key)}">
          <label class="rt-toggle" data-tip="开启/暂停这条路由（关掉即暂时静音，停止收发消息）"><input type="checkbox" class="ui-switch" data-route="enabled" data-key="${esc(r.key)}" ${on ? 'checked' : ''}/></label>
          <span class="grow">${icon} ${esc(r.title)}${topicBit}</span>${on ? '' : '<span class="ui-badge ui-badge--warning">已静音</span>'}${sess}
          <span class="m">${open ? '▾' : '▸'}</span></div>`;
        const cls = on ? 'rt' : 'rt muted';
        if (!open) return `<div class="${cls}">${head}</div>`;
        const req = (r.requests ?? []).map((u) => `<span class="ui-badge ui-badge--warning">${esc(u.name)}<button class="x" data-tip="批准为普通用户（进白名单）" data-approve="${esc(r.key)}|${u.id}">＋</button></span>`).join('');
        const allow = (r.allow ?? []).map((u) => `<span class="ui-badge">${esc(u.name)}<button class="x" data-tip="移出本路由名单" data-deny="${esc(r.key)}|${u.id}">×</button></span>`).join('');
        const sizes = [...new Set([0, 3, 5, 10, 20, r.context ?? 0])].sort((a, b) => a - b);
        const cur = view.sessionId;
        const curTitle = (view.sessions ?? []).find((s) => s.id === cur)?.title;
        const [bindLabel, bindTip, bindable] = !cur
          ? ['绑定当前', '先在主界面打开一个会话', false]
          : r.sessionId === cur
            ? ['已绑当前', '已经绑定到当前会话', false]
            : ['绑定当前', curTitle ? `改绑到当前会话：${curTitle}` : '改绑到当前会话', true];
        const body = `<div class="body">
          <div class="field-row"><span class="lbl">目标会话</span>
            <select class="ui-input" data-route="sessionId" data-key="${esc(r.key)}">${sessOptions(r.sessionId)}</select>
            <span class="acts">${r.sessionId ? `<button class="ui-btn ui-btn--sm ui-btn--outline" data-focus="${esc(r.sessionId)}" data-tip="跳到这个会话">跳转 ↗</button>` : ''}
              <span class="tip" data-tip="${esc(bindTip)}"><button class="ui-btn ui-btn--sm ui-btn--outline" data-bind-current="${esc(r.key)}"${bindable ? '' : ' disabled'}>${bindLabel}</button></span></span></div>
          <div class="row wrap">
            <label class="switch" data-tip="把 EnsoCode 里的对话也发到这个聊天"><input type="checkbox" class="ui-switch" data-route="sync" data-key="${esc(r.key)}" ${r.sync ? 'checked' : ''}/>同步</label>
            <label class="switch" data-tip="开启后成员无需 @机器人，直接发消息即可触发（受白名单约束）"><input type="checkbox" class="ui-switch" data-route="directTrigger" data-key="${esc(r.key)}" ${r.directTrigger ? 'checked' : ''}/>免 @ 直发</label>
            <span class="btns"><button class="ui-btn ui-btn--sm ui-btn--outline" data-fresh="${esc(r.key)}" data-tip="新建一个会话并把这个聊天改绑过去">新建会话</button>
            <button class="ui-btn ui-btn--sm ui-btn--destructive" data-unbind="${esc(r.key)}">解绑</button></span>
          </div>
          ${r.chatType !== 'private' ? `<div class="field-row"><span class="lbl">白名单</span>
            <select class="ui-input" data-route="whitelistMode" data-key="${esc(r.key)}">
              <option value="inherit" ${r.whitelistMode === 'inherit' ? 'selected' : ''}>继承全局</option>
              <option value="custom" ${r.whitelistMode === 'custom' ? 'selected' : ''}>本路由独立</option>
              <option value="open" ${r.whitelistMode === 'open' ? 'selected' : ''}>全群开放</option>
            </select></div>
          <div class="users">${allow || (r.whitelistMode === 'open'
            ? '<span class="m">全群开放：群内所有成员均可触发</span>'
            : r.whitelistMode === 'inherit'
              ? '<span class="m">本路由追加名单为空（叠加全局名单生效）</span>'
              : '<span class="m">本路由名单为空</span>')}</div>
          ${req ? `<div class="users"><span class="m">待批准：</span>${req}</div>` : ''}` : ''}
          <div class="grid">
            <label>上下文条数
              <select class="ui-input" data-route="context" data-key="${esc(r.key)}">${sizes.map((n) => `<option value="${n}" ${n === r.context ? 'selected' : ''}>${n ? `最近 ${n} 条` : '关'}</option>`).join('')}</select></label>
            <label>攒批安静期（秒，0 即时）
              <input class="ui-input" type="number" min="0" max="3600" value="${r.debounceSec ?? 0}" data-route="debounceSec" data-key="${esc(r.key)}" data-num/></label>
            <label>最小触发间隔（秒，0 不限）
              <input class="ui-input" type="number" min="0" max="86400" value="${r.minIntervalSec ?? 0}" data-route="minIntervalSec" data-key="${esc(r.key)}" data-num/></label>
          </div>
          <label class="switch" style="align-items:flex-start;flex-direction:column;gap:4px;white-space:normal">提示词前置（每次注入拼在消息顶部）
            <textarea class="ui-input" data-route="promptPrefix" data-key="${esc(r.key)}" placeholder="例如：你是本群的客服助手，回答控制在三句话以内。">${esc(r.promptPrefix ?? '')}</textarea></label>
          ${r.context && view.bot?.readsAll === false ? '<div class="m err">机器人开着隐私模式，只能看到 @ 它或回复它的消息。到 @BotFather 发 /setprivacy 选 Disable，再把机器人移出群重新拉进来。</div>' : ''}
        </div>`;
        return `<div class="${cls}">${head}${body}</div>`;
      }

      function routesTab() {
        const routes = view.routes ?? [];
        const list = routes.length
          ? routes.map(routeCard).join('')
          : '<div class="m">还没有绑定。在群里发 /bind 配对码，或从下方已发现的聊天一键绑定。</div>';
        const pairing = view.pairing
          ? `<div class="card-head"><h3>配对绑定</h3>
               <button class="ui-btn ui-btn--sm ui-btn--outline" data-cancel-pair="${esc(view.pairing.code)}" data-tip="关闭并作废这个配对码">取消 ×</button></div>
             <div class="code ui-mono">${esc(view.pairing.code)}</div>
             ${view.pairing.link ? `<div class="btns"><button class="ui-btn ui-btn--primary" data-open="${esc(view.pairing.link)}">绑定私聊</button>
               <button class="ui-btn ui-btn--outline" data-open="${esc(view.pairing.groupLink)}">绑定到群聊</button></div>` : ''}
             <div class="m">或在 Bot 私聊里发 <b>/bind ${esc(view.pairing.code)}</b>；群/话题里发 <b>/bind@${esc(view.bot?.username ?? 'bot')} ${esc(view.pairing.code)}</b>（话题内发出即绑该话题）。</div>`
          : `<button class="ui-btn ui-btn--primary ui-btn--block" data-pair ${view.sessionId ? '' : 'disabled'}>＋ 配对绑定</button>${view.sessionId ? '' : '<div class="m">打开一个会话后才能配对</div>'}`;
        const unbound = (view.knownChats ?? []).flatMap((c) => {
          const rows = [];
          const chatKey = String(c.id);
          if (!c.boundKeys.includes(chatKey)) {
            rows.push(`<div class="row"><span class="grow">${c.type === 'private' ? '👤' : '👥'} ${esc(c.title || c.id)}</span>
              <button class="ui-btn ui-btn--sm ui-btn--outline" data-bind="${chatKey}|">${c.type === 'private' ? '绑定私聊' : '绑定整群'}</button></div>`);
          }
          if (c.isForum) {
            for (const t of c.topics ?? []) {
              const k = `${chatKey}:${t.id}`;
              if (!c.boundKeys.includes(k)) {
                rows.push(`<div class="row topicrow"><span class="grow"># ${esc(t.name)}</span>
                  <button class="ui-btn ui-btn--sm ui-btn--outline" data-bind="${chatKey}|${t.id}">绑定话题</button></div>`);
              }
            }
          }
          return rows;
        });
        const idle = routes.length && view.running === false
          ? `<div class="m">本会话还没启动，收到 Telegram 消息时会自动启动${view.queued ? `（已排队 ${view.queued} 条）` : ''}。</div>`
          : '';
        return `<div class="ui-card card"><h3>路由绑定</h3>${idle}${list}</div>
          <div class="ui-card card">${pairing}</div>
          ${unbound.length ? `<div class="ui-card card"><h3>已发现的群与话题（一键绑定到本会话）</h3><div class="chat">${unbound.join('')}</div></div>` : ''}`;
      }

      function accessTab() {
        const admins = (view.admins ?? []).map((u) =>
          `<span class="ui-badge ui-badge--brand">${esc(u.name)} <span class="m">${u.id}</span><button class="x" data-tip="取消管理员" data-unadmin="${u.id}">×</button></span>`
        ).join('') || '<span class="m err">还没有管理员：所有人的消息都按外部数据处理，/stop、/session 等管理命令和提问作答谁都用不了。</span>';
        const cands = (view.adminCandidates ?? []).map((u) =>
          `<button class="ui-btn ui-btn--sm ui-btn--outline" data-mkadmin="${u.id}|${esc(u.name)}">＋ ${esc(u.name)}</button>`
        ).join('');
        const users = (view.globalAllow ?? []).map((u) =>
          `<span class="ui-badge">${esc(u.name)} <span class="m">${u.id}</span><button class="x" data-tip="移出全局白名单" data-gdeny="${u.id}">×</button></span>`
        ).join('') || '<span class="m">全局白名单为空。继承模式下，只有名单内成员（与各路由自己的名单）能使用机器人。</span>';
        const reqs = (view.routes ?? []).flatMap((r) => (r.requests ?? []).map((u) => ({ r, u })));
        const reqHtml = reqs.map(({ r, u }) =>
          `<div class="row wrap"><span class="grow">${esc(u.name)} <span class="m">@${esc(r.title)}${r.topicName ? ' #' + esc(r.topicName) : ''}</span></span>
            <span class="btns"><button class="ui-btn ui-btn--sm ui-btn--outline" data-approve="${esc(r.key)}|${u.id}">批准为普通用户</button>
            <button class="ui-btn ui-btn--sm ui-btn--primary" data-approve-admin="${esc(r.key)}|${u.id}">批准为管理员</button></span></div>`
        ).join('');
        return `<div class="ui-card card"><h3>管理员（可信）</h3>
            <div class="m">管理员的消息作为可信指令直接交给会话，并且只有管理员能用 /stop、/steer、/session、/sync、/allow、/admin 等命令和回答提问。首位用配对码绑定的人自动成为管理员；匿名管理员认不出是谁，不能设为管理员。</div>
            <div class="users">${admins}</div>
            ${cands ? `<div class="users"><span class="m">从熟人里添加：</span>${cands}</div>` : ''}
            <div class="row"><input class="ui-input" type="text" id="ad-id" placeholder="Telegram User ID（数字）" style="flex:1"/>
              <input class="ui-input" type="text" id="ad-name" placeholder="备注名（可选）" style="flex:1"/>
              <button class="ui-btn ui-btn--sm ui-btn--primary" data-aadd>添加</button></div></div>
          <div class="ui-card card"><h3>全局白名单（普通用户，不可信）</h3>
            <div class="m">白名单成员可以在群里触发机器人，但消息按外部数据处理，只能用 /status、/help、/id。</div>
            <div class="users">${users}</div>
            <div class="row"><input class="ui-input" type="text" id="wl-id" placeholder="Telegram User ID（数字）" style="flex:1"/>
              <input class="ui-input" type="text" id="wl-name" placeholder="备注名（可选）" style="flex:1"/>
              <button class="ui-btn ui-btn--sm ui-btn--primary" data-gadd>添加</button></div>
            <div class="m">对机器人发 /id 或用 @userinfobot 可以查到 User ID。</div></div>
          ${reqs.length ? `<div class="ui-card card"><h3>待批准请求</h3>${reqHtml}</div>` : ''}`;
      }

      function compose() {
        const v = view;
        const err = error ? `<div class="err">${esc(error)}</div>` : '';
        if (!v) return { conn: '', tabs: '', body: error ? '' : '<div class="ui-empty">加载中…</div>', err };
        let conn;
        if (!v.configured) {
          conn = `<div class="ui-card card"><b>连接 Telegram 机器人</b>
            <input type="password" class="ui-input" id="tk" placeholder="粘贴 Bot Token" autocomplete="off"/>
            <button class="ui-btn ui-btn--primary ui-btn--block" data-connect>校验并连接</button>
            ${v.canSetToken === false ? '<div class="m">当前 EnsoCode 版本不支持从面板保存 Token：请到 设置 → 插件 → Telegram 填写，并建议升级 EnsoCode。</div>' : ''}
            <details><summary>怎么拿 Token？（3 步）</summary>
              <ol><li>在 Telegram 找 @BotFather，发 /newbot 创建机器人</li>
              <li>复制它给的 Token（形如 123456:ABC…）</li><li>粘到上面的框里，点「校验并连接」</li></ol>
              <div class="m">要在群里看到所有消息：@BotFather 发 /setprivacy 选 Disable，再把机器人移出群重新拉进来。</div></details></div>`;
        } else {
          const botLine = v.bot
            ? `<div class="row"><span class="grow"><b>@${esc(v.bot.username)}</b> <span class="m">${esc(v.bot.name)} · ${esc(v.tokenHint ?? '')}</span></span><span class="ui-badge ui-badge--success">已连接</span></div>`
            : `<div class="row"><span class="grow err">${esc(v.error ?? '连不上 Telegram')}</span><span class="ui-badge ui-badge--destructive">连接失败</span></div>`;
          const warn = v.bot?.readsAll === false
            ? '<div class="m err">隐私模式开启中：机器人在群里只能看到 @ 它或回复它的消息。需要群上下文/免@直发时请关闭：@BotFather → /setprivacy → Disable，再把机器人移出群重新拉进来。</div>'
            : '';
          conn = `<div class="ui-card card">${botLine}${warn}
            <div class="btns"><button class="ui-btn ui-btn--outline" data-change>更换 Token</button>
            <button class="ui-btn ui-btn--destructive" data-disconnect>断开连接</button></div>
            ${changingToken ? `<div class="row"><input type="password" class="ui-input" id="tk" placeholder="粘贴新 Token" autocomplete="off"/>
              <button class="ui-btn ui-btn--sm ui-btn--primary" data-connect>校验并连接</button></div>` : ''}</div>`;
        }
        const tabs = v.configured
          ? `<div class="tabs"><button class="tab ${tab === 'routes' ? 'on' : ''}" data-tab="routes">路由绑定</button>
             <button class="tab ${tab === 'whitelist' ? 'on' : ''}" data-tab="whitelist">权限</button></div>`
          : '';
        const body = v.configured ? (tab === 'routes' ? routesTab() : accessTab()) : '';
        return { conn, tabs, body, err };
      }

      /** 逐插槽比对快照；含焦点输入框或按下中元素的插槽推迟到 focusout / pointerup 之后 */
      function render() {
        const parts = compose();
        const active = document.activeElement;
        for (const name of SLOTS) {
          const html = parts[name];
          if (snap[name] === html) { stale.delete(name); continue; }
          const el = slots[name];
          if ((pressTarget && el.contains(pressTarget)) || (editing() && el.contains(active))) { stale.add(name); continue; }
          snap[name] = html;
          el.innerHTML = html;
          stale.delete(name);
        }
      }

      const fail = (message) => { error = message; errorFrom = 'action'; render(); };
      async function jump(sessionId) {
        try { await window.enso.call('focus', { sessionId }); }
        catch (e) { fail(e?.message ?? String(e)); }
      }

      app.addEventListener('click', (e) => {
        // 头部的路由开关：交给 change 事件处理，不能冒泡成折叠/展开
        if (e.target.closest('.rt-toggle, input[data-route]')) { e.stopPropagation(); return; }
        const t = e.target.closest('button, .head');
        if (!t) return;
        if (t.dataset.focus) { e.stopPropagation(); jump(t.dataset.focus); return; }
        if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
        if (t.dataset.toggle) {
          openKeys.has(t.dataset.toggle) ? openKeys.delete(t.dataset.toggle) : openKeys.add(t.dataset.toggle);
          render(); return;
        }
        if (t.hasAttribute('data-change')) {
          changingToken = !changingToken;
          render();
          if (changingToken) document.getElementById('tk')?.focus();
          return;
        }
        if (t.hasAttribute('data-connect')) {
          const input = document.getElementById('tk');
          run('connect', { token: input?.value ?? '' });
          return;
        }
        if (t.hasAttribute('data-disconnect')) { changingToken = false; run('disconnect'); }
        else if (t.hasAttribute('data-pair')) run('pair');
        else if (t.dataset.cancelPair) run('cancelPair', { code: t.dataset.cancelPair });
        else if (t.dataset.unbind) run('unbind', { key: t.dataset.unbind });
        else if (t.dataset.fresh) run('fresh', { key: t.dataset.fresh });
        else if (t.dataset.bindCurrent) run('route', { key: t.dataset.bindCurrent, patch: { bindCurrent: true } });
        else if (t.dataset.bind) {
          const [chatId, topicId] = t.dataset.bind.split('|');
          run('bind', { chatId, topicId: topicId || undefined });
        }
        else if (t.dataset.approve) {
          const [key, userId] = t.dataset.approve.split('|');
          run('approve', { key, userId: Number(userId), on: true });
        }
        else if (t.dataset.approveAdmin) {
          const [key, userId] = t.dataset.approveAdmin.split('|');
          run('approve', { key, userId: Number(userId), on: true, asAdmin: true });
        }
        else if (t.dataset.deny) {
          const [key, userId] = t.dataset.deny.split('|');
          run('approve', { key, userId: Number(userId), on: false });
        }
        else if (t.dataset.gdeny) run('globalAllow', { userId: Number(t.dataset.gdeny), on: false });
        else if (t.dataset.unadmin) run('admin', { userId: Number(t.dataset.unadmin), on: false });
        else if (t.dataset.mkadmin) {
          const i = t.dataset.mkadmin.indexOf('|');
          run('admin', { userId: Number(t.dataset.mkadmin.slice(0, i)), name: t.dataset.mkadmin.slice(i + 1), on: true });
        }
        else if (t.hasAttribute('data-gadd') || t.hasAttribute('data-aadd')) {
          const p = t.hasAttribute('data-aadd') ? 'ad' : 'wl';
          const id = Number(document.getElementById(`${p}-id`)?.value);
          const name = document.getElementById(`${p}-name`)?.value?.trim();
          if (!Number.isInteger(id) || id <= 0) { fail('User ID 要是正整数'); return; }
          run(p === 'ad' ? 'admin' : 'globalAllow', { userId: id, name: name || String(id), on: true });
        }
        else if (t.dataset.open) window.enso.call('open', { url: t.dataset.open }).catch((err) => fail(err.message));
      });

      const patchRoute = (key, patch) => run('route', { key, patch });
      app.addEventListener('change', (e) => {
        const { route: field, key, num } = e.target.dataset ?? {};
        if (!field || !key) return;
        let value;
        if (e.target.type === 'checkbox') value = e.target.checked;
        else if (num !== undefined || ['context', 'debounceSec', 'minIntervalSec'].includes(field)) value = Number(e.target.value);
        else value = e.target.value;
        patchRoute(key, { [field]: value });
      });
      // textarea 用 blur 提交，避免逐字符触发
      app.addEventListener('focusout', (e) => {
        const { route: field, key } = e.target.dataset ?? {};
        if (field === 'promptPrefix' && key) patchRoute(key, { promptPrefix: e.target.value });
      });

      run('state');
      // 跟随会话切换和后台完成的绑定；不中断正在编辑的控件（见 render()）
      setInterval(() => run('state'), 1500);
      if (typeof window.enso?.onSession === 'function') window.enso.onSession(() => run('state'));
    </script>
  </body>
</html>
