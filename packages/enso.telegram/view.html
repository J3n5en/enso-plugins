<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <style>
      body { padding: 10px; font-size: 12px; }
      #app { display: flex; flex-direction: column; gap: 8px; }
      .card { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      h3 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
      b { font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .chats { display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
      .chats > .row { padding: 4px 6px; border-radius: var(--radius-md); }
      .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .m { color: var(--muted-foreground); font-size: 11px; }
      .code { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: 6px; text-align: center; padding: 10px 0; border-radius: var(--radius-md); background: var(--muted); user-select: all; }
      .code > span { padding-left: 6px; }
      .ui-btn--block { width: 100%; height: 32px; }
      ol { margin: 0; padding-left: 18px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 2px; }
      label.switch { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 11px; cursor: pointer; flex: none; }
      .err { color: var(--destructive); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"><div class="ui-card card"><div class="ui-skeleton" style="height: 14px; width: 60%"></div></div></div>
    <script src="enso-ui.js"></script>
    <script>
      const app = document.getElementById('app');
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      let view = null;
      let error = '';
      let busy = false;
      let lastCode = '';
      ensoUI.tooltip();

      let last = '';
      async function run(method, args) {
        if (busy) return;
        busy = true;
        try {
          const next = await window.enso.call(method, args ?? {});
          const key = JSON.stringify(next);
          // 轮询结果没变就不重绘，避免打断正在点的控件
          if (method === 'state' && key === last && !error) return;
          last = key;
          view = next;
          error = '';
        } catch (e) {
          error = e?.message ?? String(e);
        } finally {
          busy = false;
          render();
        }
      }

      function render() {
        const v = view;
        if (!v) return (app.innerHTML = error ? `<div class="ui-empty err">${esc(error)}</div>` : '<div class="ui-empty">加载中…</div>');
        if (!v.configured) {
          app.innerHTML = `<div class="ui-card card ui-enter"><b>还没有 Bot Token</b>
            <ol><li>在 Telegram 找 @BotFather，发 /newbot 创建机器人</li>
            <li>复制它给的 Token</li><li>填到 设置 → 插件 → Telegram → Bot Token</li></ol></div>`;
          return;
        }
        const bot = v.bot
          ? `<div class="row"><span class="grow"><b>@${esc(v.bot.username)}</b> <span class="m">${esc(v.bot.name)}</span></span><span class="ui-badge ui-badge--success">已连接</span></div>`
          : `<div class="row"><span class="grow err">${esc(v.error)}</span><span class="ui-badge ui-badge--destructive">连不上 Telegram</span></div>`;
        let body;
        if (!v.sessionId) body = '<div class="ui-empty">打开一个会话后在这里绑定</div>';
        else {
          const chats = v.bindings.length
            ? '<div class="chats">' + v.bindings.map((b) => `<div class="row" data-fill>
                <span class="grow">${b.chatType === 'private' ? '👤' : '👥'} ${esc(b.title ?? b.chatId)}</span>
                <label class="switch" data-tip="把在 EnsoCode 里的对话也发到这个聊天"><input type="checkbox" class="ui-switch" data-sync="${b.chatId}" ${b.sync ? 'checked' : ''}/>同步</label>
                <button class="ui-btn ui-btn--sm ui-btn--destructive" data-unbind="${b.chatId}">解绑</button></div>`).join('') + '</div>'
            : '<div class="m">还没有绑定聊天</div>';
          const pairing = v.pairing
            ? `<div class="code ui-mono" data-code></div>
               ${v.pairing.link ? `<button class="ui-btn ui-btn--primary ui-btn--block" data-open="${esc(v.pairing.link)}">在 Telegram 中打开并绑定</button>` : ''}
               <div class="m">或在 Bot 私聊里发 <b>/bind ${esc(v.pairing.code)}</b>；群聊里发 <b>/bind@${esc(v.bot?.username ?? 'bot')} ${esc(v.pairing.code)}</b>。<span data-left></span></div>`
            : `<button class="ui-btn ui-btn--primary ui-btn--block" data-pair>绑定 Telegram 聊天</button>`;
          body = `<div class="ui-card card"><h3>本会话的聊天</h3>${chats}</div><div class="ui-card card">${pairing}</div>`;
        }
        const others = v.others ? `<div class="m" style="text-align:center">其他会话还绑定了 ${v.others} 个聊天</div>` : '';
        app.innerHTML = `<div class="ui-card card">${bot}</div>${body}${others}${error ? `<div class="err">${esc(error)}</div>` : ''}`;
        ensoUI.fill(app.querySelector('.chats'));
        const codeEl = app.querySelector('[data-code]');
        if (codeEl) {
          // innerHTML 重绘后先放回旧码，配对码变化时再做一次 TextSwap
          if (lastCode) ensoUI.swap(codeEl, lastCode);
          ensoUI.swap(codeEl, v.pairing.code);
          lastCode = v.pairing.code;
        }
        tick();
      }

      function tick() {
        const el = app.querySelector('[data-left]');
        if (!el || !view?.pairing) return;
        const s = Math.max(0, Math.round((view.pairing.expiresAt - Date.now()) / 1000));
        el.textContent = s ? ` ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} 后失效` : ' 已失效';
      }

      app.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.hasAttribute('data-pair')) run('pair');
        else if (t.dataset.unbind) run('unbind', { chatId: Number(t.dataset.unbind) });
        else if (t.dataset.open) window.enso.call('open', { url: t.dataset.open }).catch((err) => ((error = err.message), render()));
      });
      app.addEventListener('change', (e) => {
        const id = e.target.dataset?.sync;
        if (id) run('sync', { chatId: Number(id), on: e.target.checked });
      });

      run('state');
      // 跟随会话切换和后台完成的绑定；state 只读本地文件，开销很小
      setInterval(() => run('state'), 1500);
      setInterval(tick, 1000);
    </script>
  </body>
</html>
