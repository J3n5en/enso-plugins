<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="enso-ui.css" />
    <style>
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: var(--background);
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      [hidden] { display: none !important; }
      button { background: none; border: 0; padding: 0; cursor: pointer; }
      svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      header, .toolbar, .pager, .pathbar { display: flex; align-items: center; gap: 8px; }
      header { padding: 10px 12px 0; min-width: 0; }
      header h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .meta { color: var(--muted-foreground); font: 500 11.5px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .spacer { flex: 1; }
      .pathbar, .tabs, .notice, .error, #picker { padding: 8px 12px 0; }
      .pathbar .ui-input { flex: 1; min-width: 0; }
      .tabs { display: flex; align-items: center; gap: 8px; }
      .notice, .error {
        margin: 8px 12px 0;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        font-size: 12px;
        line-height: 1.45;
      }
      .notice { color: var(--warning); background: color-mix(in oklch, var(--warning) 12%, transparent); }
      .error { color: var(--destructive); background: color-mix(in oklch, var(--destructive) 10%, transparent); }
      #picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }
      #picker p { margin: 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
      #recent, #found { display: flex; flex-direction: column; gap: 2px; }
      #recent button, #found button, #objects button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        text-align: left;
        font-size: 12px;
      }
      #objects button[aria-current='true'] { color: var(--foreground); font-weight: 600; }
      .kind { color: var(--muted-foreground); font-size: 11px; margin-left: auto; }
      #workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); }
      aside { min-height: 0; overflow: auto; border-right: 1px solid var(--border); padding: 6px; }
      aside h2 { margin: 4px 8px 6px; font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: 0.04em; }
      main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .toolbar, .pager { padding: 8px 12px; gap: 6px; }
      .toolbar .ui-input { max-width: 240px; }
      .sql-wrap { padding: 0 12px; }
      textarea.sql {
        min-height: 112px;
        max-height: 240px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
      }
      .hint { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; }
      .grid-wrap { flex: 1; min-height: 80px; overflow: auto; border-top: 1px solid var(--border); }
      table.data { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: max-content; }
      table.data th, table.data td {
        height: 28px;
        max-width: 320px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid color-mix(in oklch, var(--border) 70%, transparent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--background);
        vertical-align: middle;
      }
      table.data th { font-weight: 600; text-align: left; }
      thead tr.names th { position: sticky; top: 0; z-index: 2; background: var(--card); }
      thead tr.filters th { position: sticky; top: 28px; z-index: 2; background: var(--card); padding: 3px 4px; }
      table.data .rownum {
        position: sticky;
        left: 0;
        z-index: 3;
        min-width: 48px;
        text-align: right;
        color: var(--muted-foreground);
        font: 500 11px/28px var(--font-mono);
        font-variant-numeric: tabular-nums;
        background: var(--muted);
      }
      thead .rownum { z-index: 4; }
      th .sort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 280px;
        height: 28px;
        font-weight: 600;
      }
      th .mark { color: var(--brand); font-size: 10px; }
      th .ui-input { height: 22px; min-height: 22px; padding: 0 6px; font-size: 11px; }
      td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      td.null { color: var(--muted-foreground); font-style: italic; }
      td.blob { color: var(--muted-foreground); font-family: var(--font-mono); font-size: 11px; }
      td.selected { background: color-mix(in oklch, var(--brand) 14%, var(--background)); }
      td.active { box-shadow: inset 0 0 0 1.5px var(--brand); }
      .detail {
        max-height: 112px;
        overflow: auto;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.5 var(--font-mono);
        background: color-mix(in oklch, var(--muted) 45%, transparent);
      }
      .detail .label { color: var(--muted-foreground); font-family: var(--font-sans); margin-right: 8px; }
      .pager { border-top: 1px solid var(--border); }
      .pager select { width: auto; height: 24px; min-height: 24px; padding-right: 22px; }
      .schema { overflow: auto; padding: 4px 12px 16px; }
      .schema h3 { margin: 14px 0 6px; font-size: 12px; }
      .schema article {
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--card);
        box-shadow: var(--shadow-xs);
      }
      .schema .name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; }
      .schema pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: 11.5px/1.55 var(--font-mono);
      }
      .empty { padding: 28px 12px; }
      .menu {
        position: fixed;
        z-index: 20;
        min-width: 180px;
        padding: 4px;
      }
      .menu button { display: block; width: 100%; padding: 6px 8px; border-radius: var(--radius-sm); text-align: left; font-size: 12px; }
      .menu button:hover { background: var(--hover); }
      @media (max-width: 680px) {
        #workspace { grid-template-columns: 1fr; }
        aside { max-height: 132px; border-right: 0; border-bottom: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title-wrap">
        <h1 id="title">SQLite</h1>
        <span class="ui-badge">只读</span>
      </div>
      <span id="meta" class="meta"></span>
      <span class="spacer"></span>
      <button id="refresh" class="ui-btn ui-btn--outline ui-btn--sm" type="button" hidden>重新读取</button>
    </header>
    <div id="picker">
      <p id="picker-help">输入项目里的相对路径，或查找 <code>.db</code>、<code>.sqlite</code>、<code>.sqlite3</code> 文件。数据库以只读方式打开。</p>
      <div class="pathbar" style="padding: 0">
        <input id="path" class="ui-input" type="text" placeholder="例如 data/app.db" spellcheck="false" aria-label="数据库相对路径" />
        <button id="open-path" class="ui-btn ui-btn--primary ui-btn--sm" type="button">打开</button>
        <button id="find" class="ui-btn ui-btn--outline ui-btn--sm" type="button">查找</button>
      </div>
      <div id="recent"></div>
      <div id="found"></div>
    </div>
    <div id="notice" class="notice" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="tabs" class="tabs" hidden>
      <div id="modes" class="ui-seg" role="tablist">
        <button type="button" data-mode="data" role="tab" aria-selected="true">数据</button>
        <button type="button" data-mode="sql" role="tab" aria-selected="false">SQL 查询</button>
        <button type="button" data-mode="schema" role="tab" aria-selected="false">结构</button>
      </div>
      <span id="sql-hint" class="hint" hidden>⌘/Ctrl + Enter 运行当前语句或选中的文本</span>
    </div>
    <div id="workspace" hidden>
      <aside id="aside">
        <h2>表和视图</h2>
        <div id="objects"></div>
      </aside>
      <main>
        <section id="panel-data" class="panel">
          <div class="toolbar">
            <input id="search" class="ui-input" type="search" placeholder="搜索行" aria-label="搜索行" />
            <span class="hint" data-tip="=x、!=x、&gt;x、&gt;=x、&lt;x、&lt;=x、null、!null，其余按包含匹配">列筛选</span>
            <span class="spacer"></span>
            <button id="export-data" class="ui-btn ui-btn--outline ui-btn--sm" type="button">导出 CSV</button>
          </div>
          <div id="grid-data" class="grid-wrap"></div>
          <div id="detail" class="detail">选择一个单元格查看完整内容</div>
          <div class="pager">
            <button id="prev" class="ui-btn ui-btn--outline ui-btn--sm" type="button">上一页</button>
            <button id="next" class="ui-btn ui-btn--outline ui-btn--sm" type="button">下一页</button>
            <span id="page-label" class="meta"></span>
            <span class="spacer"></span>
            <select id="page-size" class="ui-input" aria-label="每页行数">
              <option value="50">50 行</option>
              <option value="100" selected>100 行</option>
              <option value="200">200 行</option>
            </select>
          </div>
        </section>
        <section id="panel-sql" class="panel" hidden>
          <div class="sql-wrap">
            <textarea id="sql" class="ui-input sql" spellcheck="false" placeholder="SELECT * FROM 表名 LIMIT 100" aria-label="SQL"></textarea>
          </div>
          <div class="toolbar">
            <button id="run" class="ui-btn ui-btn--primary ui-btn--sm" type="button">运行</button>
            <button id="cancel" class="ui-btn ui-btn--outline ui-btn--sm" type="button" disabled>取消</button>
            <span id="sql-message" class="hint"></span>
            <span class="spacer"></span>
            <button id="export-sql" class="ui-btn ui-btn--outline ui-btn--sm" type="button">导出 CSV</button>
          </div>
          <div id="grid-sql" class="grid-wrap"></div>
        </section>
        <section id="panel-schema" class="panel" hidden>
          <div id="schema" class="schema"></div>
        </section>
      </main>
    </div>
    <div id="menu" class="menu ui-pop" hidden role="menu"></div>
    <script src="enso-ui.js"></script>
    <script src="browser.js"></script>
  </body>
</html>
